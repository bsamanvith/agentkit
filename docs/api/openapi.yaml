          },
          "id": {
            "type": "string"
          },
          "conversation_id": {
            "type": "string"
          },
          "agent": {
            "type": "string",
            "description": "The conversation's agent."
          },
          "status": {
            "enum": [
              "running",
              "done",
              "failed"
            ]
          },
          "created_at": {
            "type": "string",
            "format": "date-time"
          },
          "finished_at": {
            "type": "string",
            "format": "date-time"
          },
          "answer": {
            "type": "string",
            "description": "The final message's text, once done."
