          "interaction": {
            "enum": [
              "interactive",
              "supervised",
              "autonomous"
            ],
            "description": "Narrows the agent's interaction mode for this run, and every resume of it: whether its tool calls may wait for people. interactive and supervised wait (a tool that asks, such as ask_user; a call the policy wants approved): the run is suspended until answered (POST /v1/runs/{id}/input). autonomous never waits: ask_user is not offered, and a call that wants an approval is refused, saying why. The stricter of the agent's mode and this one wins. Only with a message: a resumed run keeps its mode. An unknown mode is 400 invalid_request."
          },
