      "Event": {
        "type": "object",
        "description": "One event of a run's stream: the JSON of an SSE data line, whose event name is its type. A run's events are one run_start; per turn its text_delta events, a tool_call and tool_result per tool call (with its tool_policy and tool_flagged, if any, in between, and after a ui_render call's tool_result its ui events), and one turn_done; and last one run_done or run_error. A call that waits for people has an interrupt where its tool_result would be, and the execution ends there (run_error suspended); once answered, the run's events go on in the same turn: the call's tool_call again, its tool_result, the turn's turn_done.",
        "properties": {
          "v": {
            "const": 1,
            "description": "The wire format version."
          },
          "type": {
            "type": "string",
            "description": "run_start, text_delta, tool_call, tool_policy, tool_flagged, interrupt, tool_result, ui, turn_done, retrying, run_done or run_error; new types may be added: skip an unknown one. tool_policy says what the run's tool policy decided about a call it did not plainly allow (flag: the call runs; approve: in a run that may wait for people, an interrupt follows, else like deny; deny: the call does not run, and its tool_result is the error the model was shown); tool_flagged follows the tool_policy of a flagged call, with the same fields. interrupt says a call waits for people (its interrupt). ui carries one A2UI v0.9 message an agent with UI showed (its surface_id and message): each message of a ui_render call that succeeded, in order, right after the call's tool_result."
          },
          "id": {
            "type": "string",
            "description": "Orders the run's events, and is the SSE id. Every event but text_delta is stored, and its id is its seq (\"12\"); a text_delta is only streamed, and its id is the seq of the stored event before it and its count after it, from 1 (\"12.3\"). Compare ids by seq, then count. A client that missed text_delta events has the turn's whole reply in its turn_done."
          },
          "seq": {
            "type": "integer",
            "description": "Counts the run's stored events from 1, with no gaps; a text_delta has the seq of the stored event before it."
          },
          "run_id": {
            "type": "string"
          },
          "at": {
            "type": "string",
            "format": "date-time"
          },
          "conversation_id": {
            "type": "string",
            "description": "run_start."
          },
          "prompt": {
            "$ref": "#/components/schemas/TimedMessage"
          },
          "turn": {
            "type": "integer",
            "description": "text_delta, tool_call, tool_result, turn_done: the turn, from 1."
          },
          "block": {
            "type": "integer",
            "description": "text_delta."
          },
          "text": {
            "type": "string",
            "description": "text_delta."
          },
          "call": {
            "type": "integer",
            "description": "tool_call, tool_policy, tool_flagged, interrupt, tool_result: the call's index in its turn."
          },
          "tool_use_id": {
            "type": "string"
          },
          "name": {
            "type": "string",
            "description": "tool_call, tool_policy, tool_flagged, interrupt: the tool."
          },
          "action": {
            "enum": [
              "allow",
              "flag",
              "approve",
              "deny"
            ],
            "description": "tool_policy, tool_flagged: what the policy decided. approve: in a run that may wait for people the call waits for an approval (an interrupt event follows); in an autonomous run it is refused like deny, saying so."
          },
          "policy": {
            "type": "string",
            "description": "tool_policy, tool_flagged: the policy that decided: a preset's name, agent, environment or run, or the name the policy gives itself."
          },
          "rule": {
            "type": "string",
            "description": "tool_policy, tool_flagged: the rule that decided: its name, rules[i] by position, or default."
          },
          "reason": {
            "type": "string",
            "description": "tool_policy, tool_flagged: why. A refused call's tool_result is \"not allowed in this run: \" and this reason."
          },
          "tool_kind": {
            "type": "string",
            "description": "tool_policy, tool_flagged: the tool's kind as the policy saw it (an unclassified tool is write)."
          },
          "tool_risk": {
            "type": "string",
            "description": "tool_policy, tool_flagged: the tool's risk as the policy saw it (an unclassified tool is medium)."
          },
          "interrupt": {
            "$ref": "#/components/schemas/Interrupt"
          },
          "input": {
            "description": "tool_call: the tool's input."
          },
          "content": {
            "type": "string",
            "description": "tool_result."
          },
          "is_error": {
            "type": "boolean",
            "description": "tool_result."
          },
          "duration_ms": {
            "type": "number",
            "description": "tool_result."
          },
          "record": {
            "$ref": "#/components/schemas/TurnRecord"
          },
          "answer": {
            "type": "string",
            "description": "run_done."
          },
          "final": {
            "$ref": "#/components/schemas/Message"
          },
          "usage": {
            "$ref": "#/components/schemas/Usage"
          },
          "turns": {
            "type": "integer",
            "description": "run_done, run_error: model calls."
          },
          "error": {
            "$ref": "#/components/schemas/Error"
          },
          "attempt": {
            "type": "integer",
            "description": "retrying: the attempt that comes next (2 for the first retry)."
          },
          "delay_ms": {
            "type": "number",
            "description": "retrying: how long the run waits before it."
          },
          "surface_id": {
            "type": "string",
            "description": "ui: the A2UI surface the message is about."
          },
          "message": {
            "type": "object",
            "description": "ui: the A2UI v0.9 server-to-client message (createSurface, updateComponents, updateDataModel or deleteSurface), checked against the basic catalog minus its deferred components (package pkg/a2ui)."
          }
        },
        "required": [
          "v",
          "type",
          "id",
          "seq",
          "run_id",
          "at"
        ]
      },
      "Model": {
        "type": "object",
        "description": "The model an agent runs on.",
        "properties": {
          "provider": {
