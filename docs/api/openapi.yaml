          }
        },
        "responses": {
          "204": {
            "description": "Signed in.",
            "headers": {
              "Set-Cookie": {
                "description": "Set-Cookie: the session cookie, __Host-agentkit_session (agentkit_session over plain HTTP): HttpOnly, SameSite=Strict, Path=/, Secure over TLS.",
                "schema": {
                  "type": "string"
                }
              }
            }
          },
          "400": {
            "description": "invalid_request: the body is not a LoginRequest of at most 4 KiB, or the username or password is empty.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              }
            }
          },
          "401": {
            "description": "unauthorized: the username or the password is wrong. The answer is the same for a user that does not exist.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              }
            }
          },
          "403": {
            "description": "csrf_failed: the request's Origin is another site.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              }
            }
          },
          "404": {
            "description": "not_found: the server has no password sign-in (no auth.users).",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              }
            }
          },
          "429": {
            "description": "too_many_attempts: too many failed sign-ins for the username or from the client's address; the password was not checked.",
            "headers": {
