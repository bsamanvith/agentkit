name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Tests, lint and the fuzz seed corpus (which go test runs like any test).
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: make check
        run: make check

  # The integration tier of the event bus (T089): pkg/bus against a Redis 7
  # service container, and against a redis-server binary that TestRestart
  # starts and restarts itself (installed, never started as a service).
  # AGENTKIT_REQUIRE_INTEGRATION turns a missing variable into a failure.
  integration-redis:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      AGENTKIT_REQUIRE_INTEGRATION: "1"
      AGENTKIT_REDIS_URL: redis://localhost:6379/0
      AGENTKIT_REDIS_SERVER: /usr/bin/redis-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install redis-server for TestRestart, without starting it
        run: |
          printf '#!/bin/sh\nexit 101\n' | sudo tee /usr/sbin/policy-rc.d >/dev/null
          sudo chmod +x /usr/sbin/policy-rc.d
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends redis-server
          sudo rm /usr/sbin/policy-rc.d
          redis-server --version
      - name: go test -tags integration ./pkg/bus/...
        run: go test -race -shuffle=on -count=1 -tags integration ./pkg/bus/...

  # Coverage-guided fuzzing, in parallel with check so it never delays the
  # test result. Still required: a fuzz failure turns the commit red.
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: make fuzz
        run: make fuzz FUZZTIME=10s

  # The image builds and stays within IMAGE_BUDGET_MB. A unit test can't see
  # a .dockerignore that leaves out a package cmd/ imports; this can.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: make image
        run: make image BIN=agentkit
      - name: make image-size
        run: make image-size BIN=agentkit

  # The web workspace (web/): lint, typecheck, unit tests, audit, and a
  # rebuild that must match the committed pkg/web/dist; then the browser
  # smoke test against agentkit serve, in the runner's Google Chrome (no
  # browser download).
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: make web-check
        run: make web-check
      - name: make web-smoke
        run: make web-smoke
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/apps/console/playwright-report
          retention-days: 7
