name: check

on:
  push:
    branches: [main]
  pull_request:

# Every job reads the repository and nothing else; a job that needs more
# says so in its own permissions block, with the reason (none does). Actions
# are pinned to a full commit SHA with the release in a comment (T101), and
# checkout keeps no token: make workflow-lint (actionlint, zizmor) enforces it.
permissions:
  contents: read

jobs:
  # Which jobs the change needs (scripts/ci-changes.sh): a pull request that
  # touches only docs/ and tasks/ skips the image and smoke jobs; every other
  # change, and every push to main, runs them. A skipped job reports success
  # to a required check. If this job fails, its output is empty and those jobs
  # run anyway: only an explicit "false" skips them.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.paths.outputs.code }}
    steps:
      # Depth 2: a pull request's checkout is its merge commit, whose first
      # parent is the base branch, so HEAD^1..HEAD is what the PR changes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: the checkout left no credentials in .git/config
        run: scripts/check-no-git-credentials.sh
      - name: scripts/ci-changes.sh HEAD^1 HEAD
        id: paths
        run: |
          if [ "$EVENT" = pull_request ]; then
            scripts/ci-changes.sh HEAD^1 HEAD >>"$GITHUB_OUTPUT"
          else
            echo code=true >>"$GITHUB_OUTPUT"
          fi
        env:
          EVENT: ${{ github.event_name }}

  # Tests, lint and the fuzz seed corpus (which go test runs like any test;
  # coverage-guided fuzzing is local only, make fuzz).
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: the checkout left no credentials in .git/config
        run: scripts/check-no-git-credentials.sh
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # setup-go caches the module and build caches (keyed on go.sum); these
      # keep the pinned linters make builds into bin/, and golangci-lint's
      # analysis cache, so make lint neither rebuilds them nor starts cold.
      # The linters are built with go.mod's Go (Makefile), and make reuses a
      # bin/ file by name alone, so their key is exact (Makefile and go.mod)
      # with no restore-keys: a fallback could restore one built by an older
      # Go, which refuses to lint code that targets a newer one.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            bin/golangci-lint-*
            bin/actionlint-*
            bin/govulncheck-*
          key: lint-bin-${{ runner.os }}-${{ hashFiles('Makefile', 'go.mod') }}
      # golangci-lint keys its own cache entries on its version and inputs,
      # so an older analysis cache is only a head start.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/golangci-lint
          key: lint-analysis-${{ runner.os }}-${{ hashFiles('Makefile', 'go.mod', 'go.sum', '.golangci.yml') }}
          restore-keys: lint-analysis-${{ runner.os }}-
      # make check runs zizmor when it is installed (scripts/zizmor.sh).
      - name: install zizmor for make workflow-lint
        run: pipx install "zizmor==$(make -s print-zizmor-version)"
      - name: make check
        run: make check TEST_JSON="$RUNNER_TEMP/test.json"
        env:
          ZIZMOR_REQUIRED: "1"
      # Known vulnerabilities reachable from the code, in the modules and in
      # the stdlib of go.mod's toolchain (GO-2026-6809 moved it to 1.27.3).
      - name: make vulncheck
        run: make vulncheck
      # The ten slowest packages and tests (T056), passed or failed, so a
      # slow test shows here before it nears go test's timeout.
      - name: slowest tests
        if: ${{ !cancelled() }}
        run: |
          if [ -s "$RUNNER_TEMP/test.json" ]; then scripts/test-timing.sh "$RUNNER_TEMP/test.json"; fi

  # The integration tier, required like every job here: tests built with
  # -tags integration against real dependencies. pkg/bus (T089) runs against
  # a Redis 7 service container, and against a redis-server binary that
  # TestRestart starts and restarts itself (installed, never started as a
  # service). pkg/store (T088) runs every store suite, simulation and race
  # against a Postgres 17 service container, each test in a schema of its
  # own; cmd/agentkit's migrate command runs against it too. pkg/stream (T090)
  # runs its watch, notification and command tests on the Redis bus.
  # pkg/credentials (T043) runs the vault suites on Postgres under row-level
  # security, and cmd/agentkit its credentials.backend "postgres".
  # AGENTKIT_REQUIRE_INTEGRATION turns a missing variable into a failure.
  integration:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
      postgres:
        image: postgres:17
        ports: ["5432:5432"]
        env:
          POSTGRES_USER: agentkit
          POSTGRES_PASSWORD: agentkit
          POSTGRES_DB: agentkit_test
        options: >-
          --health-cmd "pg_isready -U agentkit -d agentkit_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      AGENTKIT_REQUIRE_INTEGRATION: "1"
      AGENTKIT_REDIS_URL: redis://localhost:6379/0
      AGENTKIT_REDIS_SERVER: /usr/bin/redis-server
      AGENTKIT_PG_URL: postgres://agentkit:agentkit@localhost:5432/agentkit_test?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: the checkout left no credentials in .git/config
        run: scripts/check-no-git-credentials.sh
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install redis-server for TestRestart, without starting it
        run: |
          printf '#!/bin/sh\nexit 101\n' | sudo tee /usr/sbin/policy-rc.d >/dev/null
          sudo chmod +x /usr/sbin/policy-rc.d
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends redis-server
          sudo rm /usr/sbin/policy-rc.d
          redis-server --version
      - name: go test -tags integration ./pkg/bus/... ./pkg/store/... ./pkg/stream/... ./pkg/credentials/... ./pkg/memory/postgres/...
        run: scripts/go-test-annotate.sh -race -shuffle=on -count=1 -tags integration ./pkg/bus/... ./pkg/store/... ./pkg/stream/... ./pkg/credentials/... ./pkg/memory/postgres/...
      - name: go test -tags integration -run '^(TestMigrate|TestE2EServeReplicas|TestE2ESteeringAcrossReplicas|TestCredentials|TestMemoryPostgres)' ./cmd/agentkit/
        run: scripts/go-test-annotate.sh -race -count=1 -tags integration -run '^(TestMigrate|TestE2EServeReplicas|TestE2ESteeringAcrossReplicas|TestCredentials|TestMemoryPostgres)' ./cmd/agentkit/
      # On Postgres as a role that is neither a superuser nor BYPASSRLS, owning
      # its schema: row-level security (T093, FORCE) applies to every query.
      - name: the agent API's suite on SQLite and Postgres (AGENTAPI_TEST_STORE)
        run: |
          AGENTAPI_TEST_STORE=sqlite scripts/go-test-annotate.sh -race -count=1 ./pkg/agentapi/...
          psql "$AGENTKIT_PG_URL" -v ON_ERROR_STOP=1 -c "CREATE ROLE agentkit_app LOGIN PASSWORD 'agentkit_app'" -c "CREATE SCHEMA app AUTHORIZATION agentkit_app"
          AGENTAPI_TEST_STORE="postgres://agentkit_app:agentkit_app@localhost:5432/agentkit_test?sslmode=disable&search_path=app" scripts/go-test-annotate.sh -race -count=1 ./pkg/agentapi/...

  # The image builds and stays within IMAGE_BUDGET_MB. A unit test can't see
  # a .dockerignore that leaves out a package cmd/ imports; this can. Then the
  # per-image smoke (T102): the split images run on the host's network
  # against a Postgres service, the api image migrates it (twice; the second
  # run must change nothing, scripts/migrate-check.sh) and serves it with
  # AGENTKIT_STORE_MIGRATE=off, and the smoke suite checks each image's
  # /readyz and surface and runs a chat on the fake model.
  image:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        ports: ["5432:5432"]
        env:
          POSTGRES_USER: agentkit
          POSTGRES_PASSWORD: agentkit
          POSTGRES_DB: agentkit_smoke
        options: >-
          --health-cmd "pg_isready -U agentkit -d agentkit_smoke"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: the checkout left no credentials in .git/config
        run: scripts/check-no-git-credentials.sh
      - name: make image
        run: make image BIN=agentkit
      - name: make image-size
        run: make image-size BIN=agentkit
      - name: the local and dev variants (make image-local, make image-dev)
        run: |
          make image-local && make image-size-local
          make image-dev && make image-size-dev
      - name: the split images make k8s-up deploys (make images-split)
        run: |
          make images-split
          make image-size-api && make image-size-runner && make image-size-toolsets
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
      # The images built above, never pulled: each checked against its budget
      # again, run as containers on this Postgres, and the suite (-v, strict:
      # a skip fails) must pass every test by name. The log ends with
      # "smoke: passed: ... against the images".
      - name: per-image smoke on Postgres (scripts/smoke.sh --images)
        run: scripts/smoke.sh --images
        env:
          AGENTKIT_STORE: postgres://agentkit:agentkit@localhost:5432/agentkit_smoke?sslmode=disable
      - name: the fakellm image (make image BIN=fakellm), within its own 12 MB budget
        run: make image BIN=fakellm && make image-size BIN=fakellm

  # The smoke suite (test/e2e, T007) against the split deployment run as
  # processes on the fake model: make smoke, as on a laptop. Node runs the
  # console's fake model; nothing is installed for it. Then AG-UI's
  # reference client, which make agui-client installs, against pkg/agui.
  smoke:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: the checkout left no credentials in .git/config
        run: scripts/check-no-git-credentials.sh
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
      - name: make smoke (the split deployment as processes, test/e2e)
        run: make smoke
      - name: make agui-client (AG-UI's reference client against pkg/agui, T069)
        run: make agui-client

  # The web workspace (web/): lint, typecheck, unit tests, audit, and a
  # rebuild that must match the committed pkg/web/dist; then the browser
  # smoke test against agentkit serve, in the runner's Google Chrome (no
  # browser download).
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: the checkout left no credentials in .git/config
        run: scripts/check-no-git-credentials.sh
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: make web-check
        run: make web-check
      - name: make web-smoke
        run: make web-smoke
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: web/apps/console/playwright-report
          retention-days: 7
