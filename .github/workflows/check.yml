name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Tests, lint and the fuzz seed corpus (which go test runs like any test).
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: make check
        run: make check

  # Coverage-guided fuzzing, in parallel with check so it never delays the
  # test result. Still required: a fuzz failure turns the commit red.
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: make fuzz
        run: make fuzz FUZZTIME=10s
