name: live

# The live tier (docs/ENGINEERING.md 2.2): make test-live against the real
# providers, on demand only (Actions > live > Run workflow), never on a pull
# request. There is no schedule: the owner keeps no Anthropic key in GitHub
# (T034), so live tests run in Claude sessions; a fork or a repository that
# adds the secrets can dispatch this by hand. Its keys come from repository
# secrets. ANTHROPIC_API_KEY is
# required: without it (a secret that does not exist reads as empty) make
# test-live LIVE_REQUIRED=1 fails and says so, rather than passing with every
# test skipped. The other providers' keys are optional; their tests skip
# without them.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: the checkout left no credentials in .git/config
        run: scripts/check-no-git-credentials.sh
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: make test-live LIVE_REQUIRED=1
        run: make test-live LIVE_REQUIRED=1
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          PARALLEL_API_KEY: ${{ secrets.PARALLEL_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
