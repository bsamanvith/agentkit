# The split deployment on Kubernetes (docs/COMPONENTS.md): the agent API with
# the console, a runner and the toolsets, one Deployment each, with no
# namespace and no store: an overlay adds those. deploy/k8s/local is the one
# for Docker Desktop's cluster (make k8s-up, deploy/k8s/README.md).
#
# Every pod reads the secret "agentkit": rpc-token, api-token,
# anthropic-api-key and, if it has one, gemini-api-key. The API also reads
# credentials-key, the credential vault's key ring (without it the
# connectors that need a user's account or key are skipped), and the OAuth
# apps the Connectors page connects accounts with, each optional: google-,
# hubspot- and salesforce-oauth-client-id and -client-secret
# (docs/QUICKSTART.md "Connecting accounts"). The toolsets pod keeps no
# vault: it reads each call's credential from the API
# (AGENTKIT_CREDENTIALS_URL).
#
# The store is in memory here (one API replica, lost on restart); an overlay sets AGENTKIT_STORE to a postgres:// URL (and
# AGENTKIT_BUS to redis:// for more replicas) to keep it. Every pod mounts
# the same config, the ConfigMap agentkit-config that kustomization.yaml makes
# from config.json.
#
# The toolsets pod also mounts the ConfigMap "agentkit-knowledge" at
# /etc/agentkit/knowledge: the documents of the "handbook" knowledge base
# (pkg/knowledge), a flat folder of Markdown files. scripts/k8s-local.sh
# makes it from deploy/local/agent/knowledge, the sample Northwind Bikes
# handbook. Without it the folder is empty and the handbook toolset, which is
# optional, is skipped (GET /v1/toolsets says why).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: toolsets
  labels: {app.kubernetes.io/name: agentkit, app.kubernetes.io/component: toolsets}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: agentkit, app.kubernetes.io/component: toolsets}
  template:
    metadata:
      labels: {app.kubernetes.io/name: agentkit, app.kubernetes.io/component: toolsets}
    spec:
      terminationGracePeriodSeconds: 20
      containers:
        - name: toolsets
          image: agentkit-toolsets:latest
          imagePullPolicy: IfNotPresent
          env:
            - {name: AGENTKIT_COMPONENTS, value: "toolsets,mcp-server"}
            - name: AGENTKIT_RPC_TOKEN
              valueFrom: {secretKeyRef: {name: agentkit, key: rpc-token}}
            # MCP clients send the API token to /mcp/<name>.
            - name: AGENTKIT_API_TOKEN
              valueFrom: {secretKeyRef: {name: agentkit, key: api-token}}
            # Each user's connector keys and accounts: the API's vault.
            - {name: AGENTKIT_CREDENTIALS_URL, value: "http://api:8080"}
            # Server-wide connector keys go here, and only here (TAVILY_API_KEY, ...).
          ports: [{name: http, containerPort: 8080}]
          readinessProbe: {httpGet: {path: /readyz, port: http}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 10}
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: config, mountPath: /etc/agentkit, readOnly: true}
            - {name: knowledge, mountPath: /etc/agentkit/knowledge, readOnly: true}
      volumes:
        - {name: config, configMap: {name: agentkit-config}}
        - {name: knowledge, configMap: {name: agentkit-knowledge, optional: true}}
---
apiVersion: v1
kind: Service
metadata:
  name: toolsets
spec:
  selector: {app.kubernetes.io/name: agentkit, app.kubernetes.io/component: toolsets}
  ports: [{name: http, port: 8080, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: runner
  labels: {app.kubernetes.io/name: agentkit, app.kubernetes.io/component: runner}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: agentkit, app.kubernetes.io/component: runner}
  template:
    metadata:
      labels: {app.kubernetes.io/name: agentkit, app.kubernetes.io/component: runner}
    spec:
      terminationGracePeriodSeconds: 20
      containers:
        - name: runner
          image: agentkit-runner:latest
          imagePullPolicy: IfNotPresent
          env:
            - {name: AGENTKIT_COMPONENTS, value: runner}
            - {name: AGENTKIT_TOOLSETS_URL, value: "http://toolsets:8080"}
            # Agents with a memory section keep it in the API's store.
            - {name: AGENTKIT_MEMORY_URL, value: "http://api:8080"}
            - name: AGENTKIT_RPC_TOKEN
              valueFrom: {secretKeyRef: {name: agentkit, key: rpc-token}}
            - name: ANTHROPIC_API_KEY
              valueFrom: {secretKeyRef: {name: agentkit, key: anthropic-api-key}}
            # Optional: a secret made before Gemini has no gemini-api-key.
            - name: GEMINI_API_KEY
              valueFrom: {secretKeyRef: {name: agentkit, key: gemini-api-key, optional: true}}
          ports: [{name: http, containerPort: 8080}]
          # Startup waits up to AGENTKIT_DEPENDENCY_WAIT (a minute) for the
          # toolsets before it listens: give it 90s before liveness counts.
          startupProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 2, failureThreshold: 45}
          readinessProbe: {httpGet: {path: /readyz, port: http}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 10}
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts: [{name: config, mountPath: /etc/agentkit, readOnly: true}]
      volumes: [{name: config, configMap: {name: agentkit-config}}]
---
apiVersion: v1
kind: Service
metadata:
  name: runner
spec:
  selector: {app.kubernetes.io/name: agentkit, app.kubernetes.io/component: runner}
  ports: [{name: http, port: 8080, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels: {app.kubernetes.io/name: agentkit, app.kubernetes.io/component: api}
spec:
  replicas: 1 # the memory store: one replica
  selector:
    matchLabels: {app.kubernetes.io/name: agentkit, app.kubernetes.io/component: api}
  template:
    metadata:
      labels: {app.kubernetes.io/name: agentkit, app.kubernetes.io/component: api}
    spec:
      terminationGracePeriodSeconds: 20
      containers:
        - name: api
          image: agentkit-api:latest
          imagePullPolicy: IfNotPresent
          env:
            - {name: AGENTKIT_COMPONENTS, value: "agent,web"}
            - {name: AGENTKIT_RUNNER_URL, value: "http://runner:8080"}
            - {name: AGENTKIT_TOOLSETS_URL, value: "http://toolsets:8080"}
            - name: AGENTKIT_RPC_TOKEN
              valueFrom: {secretKeyRef: {name: agentkit, key: rpc-token}}
            - name: AGENTKIT_API_TOKEN
              valueFrom: {secretKeyRef: {name: agentkit, key: api-token}}
            - name: AGENTKIT_CREDENTIALS_KEY
              valueFrom: {secretKeyRef: {name: agentkit, key: credentials-key, optional: true}}
            - name: GOOGLE_OAUTH_CLIENT_ID
              valueFrom: {secretKeyRef: {name: agentkit, key: google-oauth-client-id, optional: true}}
            - name: GOOGLE_OAUTH_CLIENT_SECRET
              valueFrom: {secretKeyRef: {name: agentkit, key: google-oauth-client-secret, optional: true}}
            - name: HUBSPOT_OAUTH_CLIENT_ID
              valueFrom: {secretKeyRef: {name: agentkit, key: hubspot-oauth-client-id, optional: true}}
            - name: HUBSPOT_OAUTH_CLIENT_SECRET
              valueFrom: {secretKeyRef: {name: agentkit, key: hubspot-oauth-client-secret, optional: true}}
            - name: SALESFORCE_OAUTH_CLIENT_ID
              valueFrom: {secretKeyRef: {name: agentkit, key: salesforce-oauth-client-id, optional: true}}
            - name: SALESFORCE_OAUTH_CLIENT_SECRET
              valueFrom: {secretKeyRef: {name: agentkit, key: salesforce-oauth-client-secret, optional: true}}
          ports: [{name: http, containerPort: 8080}]
          # Startup waits up to AGENTKIT_DEPENDENCY_WAIT (a minute) for the
          # toolsets before it listens: give it 90s before liveness counts.
          startupProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 2, failureThreshold: 45}
          readinessProbe: {httpGet: {path: /readyz, port: http}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 10}
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts: [{name: config, mountPath: /etc/agentkit, readOnly: true}]
      volumes: [{name: config, configMap: {name: agentkit-config}}]
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector: {app.kubernetes.io/name: agentkit, app.kubernetes.io/component: api}
  ports: [{name: http, port: 8080, targetPort: http}]
