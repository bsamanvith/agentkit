              "oauth2"
            ],
            "description": "The stored credential's kind, when one is stored."
          },
          "oauth": {
            "type": "boolean",
            "description": "An account can be connected for the slot (POST /v1/credentials/{slot}/connect)."
          },
          "toolsets": {
            "type": "array",
            "items": {
              "type": "string"
            },
            "description": "The server's toolsets that use the slot with this scope."
          },
          "version": {
            "type": "integer",
            "description": "Counts the stored credential's writes."
          },
          "created_at": {
            "type": "string",
            "format": "date-time"
          },
          "updated_at": {
            "type": "string",
            "format": "date-time"
          },
          "expiry": {
            "type": "string",
            "format": "date-time",
            "description": "When the stored access token expires, if it says."
          }
        },
        "required": [
          "slot",
          "scope",
          "status",
          "oauth",
          "toolsets"
        ]
      },
      "CredentialList": {
        "type": "object",
        "properties": {
          "v": {
            "const": 1,
            "description": "The wire format version."
          },
          "credentials": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/CredentialInfo"
            }
          }
        },
        "required": [
          "v",
          "credentials"
        ]
      },
      "PutCredentialRequest": {
        "type": "object",
        "description": "A credential to store. Each kind takes its own fields and no others: api_key (api_key), basic (username and password), client_credentials (client_id, client_secret, token_url and scopes).",
        "properties": {
          "scope": {
            "enum": [
              "tenant",
              "user"
            ],
            "description": "May be left out when the slot is used with one scope only."
          },
          "kind": {
            "enum": [
              "api_key",
              "basic",
              "client_credentials"
            ]
          },
          "api_key": {
            "type": "string"
          },
          "username": {
            "type": "string"
          },
          "password": {
            "type": "string"
          },
          "client_id": {
            "type": "string"
          },
          "client_secret": {
            "type": "string"
          },
          "token_url": {
            "type": "string",
            "description": "https, on a public address: the server sends the client secret there."
          },
          "scopes": {
            "type": "array",
            "items": {
              "type": "string"
            }
          }
        },
        "required": [
          "kind"
        ]
      },
      "ConnectRequest": {
        "type": "object",
        "properties": {
          "scope": {
            "enum": [
              "tenant",
              "user"
            ],
            "description": "May be left out when the slot is used with one scope only."
          },
          "return_url": {
            "type": "string",
            "description": "Where the callback sends the browser when the flow ends, with result and slot added to its query; it must have the scheme, host and path of a URL on the server's allowlist. Without it the callback shows a page of its own."
          }
        }
      },
      "ConnectResponse": {
        "type": "object",
        "properties": {
          "v": {
            "const": 1,
            "description": "The wire format version."
          },
          "authorize_url": {
            "type": "string",
            "description": "The provider's authorization page, with the flow's state and PKCE challenge."
          },
          "expires_at": {
            "type": "string",
            "format": "date-time",
            "description": "When the flow expires: the callback refuses it after."
          }
        },
        "required": [
          "v",
          "authorize_url",
          "expires_at"
        ]
      },
      "FieldError": {
        "type": "object",
        "description": "What is wrong with one field of an agent definition.",
        "properties": {
          "field": {
            "type": "string",
            "description": "The field's path in the definition (model.provider, toolsets); empty for the definition as a whole."
          },
          "message": {
            "type": "string"
          }
        },
        "required": [
          "field",
          "message"
        ]
      },
      "SaveAgentRequest": {
        "type": "object",
        "description": "A new version of a stored agent.",
        "properties": {
          "definition": {
            "type": "object",
            "description": "The agent: the shape of an entry of \"agents\" in the serve config file (description, model, system, toolsets, prefix_tool_names, runtime_toolsets, max_turns, max_total_tokens, tool_policy, interaction, isolation). Its name, if given, must be the path's. Skills, memory, ui and notify are not available to stored agents yet."
          },
          "message": {
            "type": "string",
            "description": "Why, for the version list."
          },
          "if_latest": {
            "type": "integer",
            "minimum": 0,
            "description": "Save only if the agent's latest version is this one; 0: only if the agent does not exist yet. Absent: on whatever is latest."
          },
          "publish": {
            "type": "boolean",
            "description": "Publish the new version at once."
          }
        },
        "required": [
          "definition"
        ]
      },
      "PublishRequest": {
        "type": "object",
        "properties": {
          "version": {
            "type": "integer",
            "minimum": 1
          }
        },
        "required": [
          "version"
        ]
      },
      "AgentVersion": {
        "type": "object",
        "description": "One version of a stored agent. A version never changes.",
        "properties": {
          "v": {
            "const": 1,
            "description": "The wire format version."
          },
          "name": {
            "type": "string"
          },
          "version": {
            "type": "integer",
            "minimum": 1
          },
          "published": {
            "type": "boolean",
            "description": "The version new runs use."
          },
          "published_at": {
            "type": "string",
            "format": "date-time",
            "description": "When it was first published; absent for a draft that never was."
          },
          "definition": {
            "type": "object",
            "description": "The agent as saved, with its name."
          },
          "author": {
            "type": "string",
            "description": "The key that saved it."
          },
          "message": {
            "type": "string"
          },
          "created_at": {
            "type": "string",
            "format": "date-time"
          }
        },
        "required": [
          "v",
          "name",
          "version",
          "published",
          "definition",
          "created_at"
        ]
      },
      "AgentVersionList": {
        "type": "object",
        "description": "A stored agent's versions, oldest first.",
        "properties": {
          "v": {
            "const": 1,
            "description": "The wire format version."
          },
          "name": {
            "type": "string"
          },
          "read_only": {
            "type": "boolean",
            "description": "An agent of the config file: it has no stored versions."
          },
          "published": {
            "type": "integer",
            "minimum": 0,
            "description": "The version new runs use; 0 for none."
          },
          "latest": {
            "type": "integer",
            "minimum": 0,
            "description": "The highest number given."
          },
          "versions": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/AgentVersion"
            }
          }
        },
        "required": [
          "v",
          "name",
          "published",
          "latest",
          "versions"
        ]
      },
      "Thread": {
        "type": "object",
        "description": "A thread of messages between agents. GET /v1/threads lists it without messages.",
        "properties": {
          "v": {
            "const": 1
          },
          "id": {
            "type": "string"
          },
          "status": {
            "enum": [
              "open",
              "stopped"
            ],
            "description": "open takes messages; stopped was stopped over a limit (error says which) and takes none."
          },
          "error": {
            "$ref": "#/components/schemas/Error",
            "description": "Why a stopped thread was stopped: hop_limit, token_budget or time_budget."
          },
          "hops": {
            "type": "integer",
            "description": "The number of messages in the thread."
          },
          "tokens": {
            "type": "integer",
            "description": "The tokens the runs the thread started used so far."
          },
          "created_at": {
            "type": "string",
            "format": "date-time"
          },
          "updated_at": {
            "type": "string",
            "format": "date-time"
          },
          "messages": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/ThreadMessage"
            },
            "description": "The messages in order (GET /v1/threads/{id} only)."
          }
        },
        "required": [
          "v",
          "id",
          "status",
          "hops",
          "tokens",
          "created_at",
          "updated_at"
        ]
      },
      "ThreadMessage": {
        "type": "object",
        "description": "One message of a thread.",
        "properties": {
          "id": {
            "type": "string"
          },
          "hop": {
            "type": "integer",
            "description": "Its position in the thread, from 1."
          },
          "from": {
            "type": "string",
            "description": "The sender: agent:<name>, or agentkit for the notices the server sends."
          },
          "to": {
            "type": "string",
            "description": "The recipient: agent:<name>."
          },
          "from_conversation": {
            "type": "string",
            "description": "The sender's conversation, where a reply goes."
          },
          "to_conversation": {
            "type": "string",
            "description": "The conversation its recipient processes it in."
          },
          "kind": {
            "enum": [
              "request",
              "reply",
              "notice"
            ],
            "description": "request asks for an answer, which comes back as a reply; a notice (a stopped thread) expects nothing."
          },
          "text": {
            "type": "string"
          },
          "data": {
            "description": "JSON beside the text: a notice's or a failed request's {code, message}."
          },
          "in_reply_to": {
            "type": "string",
            "description": "The request a reply answers."
          },
          "state": {
            "enum": [
              "queued",
              "running",
              "done"
            ],
            "description": "queued: not processed yet; running: a run of its recipient is answering it; done: processed."
          },
          "run_id": {
            "type": "string",
            "description": "The run of its recipient that processed it."
          },
          "created_at": {
            "type": "string",
            "format": "date-time"
          },
          "delivered_at": {
            "type": "string",
            "format": "date-time",
            "description": "When it was first handed to its recipient."
          },
          "processed_at": {
            "type": "string",
            "format": "date-time"
          }
        },
        "required": [
          "id",
          "hop",
          "from",
          "to",
          "to_conversation",
          "kind",
          "text",
          "state",
          "created_at"
        ]
      },
      "ThreadList": {
        "type": "object",
        "properties": {
          "v": {
            "const": 1,
            "description": "The wire format version."
          },
          "threads": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Thread"
            },
            "description": "Newest first, without messages."
          },
          "next_cursor": {
            "type": "string",
            "description": "Fetches the next page (?cursor=); absent on the last page. Opaque."
          }
        },
        "required": [
          "v",
          "threads"
        ]
      }
    }
  }
}
