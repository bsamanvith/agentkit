          "component_id",
          "action"
        ],
        "additionalProperties": false
      },
      "ToolPolicy": {
        "description": "Narrows the agent's tool policy for this run, and every resume of it: each tool call gets the stricter of the two decisions (deny over approve over flag over allow), so a run can never widen what its agent may do. A preset's name, or a policy. Only with a message: a resumed run keeps the policy it started with. An invalid policy is 400 invalid_request.",
        "oneOf": [
          {
            "enum": [
              "read_only",
              "low_risk_writes",
              "approve_writes",
              "all"
            ],
            "description": "read_only: read tools only. low_risk_writes: reads and low-risk writes; medium-risk writes need approval; high-risk tools, deletes, sends and executes are denied. approve_writes: reads; everything else needs approval. all: every call (a tool that requires approval still needs it)."
          },
          {
            "type": "object",
            "properties": {
              "name": {
                "type": "string",
                "pattern": "^[a-z0-9][a-z0-9_.-]{0,63}$",
                "description": "Names the policy in decisions (absent: run)."
              },
              "rules": {
                "type": "array",
                "maxItems": 256,
                "description": "Tried in order; the first that matches decides.",
                "items": {
                  "$ref": "#/components/schemas/ToolPolicyRule"
                }
              },
              "default": {
                "enum": [
                  "allow",
                  "flag",
                  "approve",
                  "deny"
                ],
                "description": "Decides a call no rule matches."
              },
              "narrowed_by": {
                "type": "array",
                "description": "Policies (or presets' names) that narrow this one: at most 8 deep, and 32 policies in all with this one.",
                "items": {
                  "$ref": "#/components/schemas/ToolPolicy"
                }
              }
            },
            "required": [
              "default"
            ],
            "additionalProperties": false
          }
        ]
      },
