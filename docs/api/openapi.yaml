  "components": {
    "securitySchemes": {
      "bearer": {
        "type": "http",
        "scheme": "bearer",
        "description": "An API key (the config's auth.api_keys, or AGENTKIT_API_KEYS_FILE), or the server's token (AGENTKIT_API_TOKEN), when it has any. A key acts for one tenant, with scopes (agent:read for GET, agent:run for the rest, agent:admin to add, review, change and remove toolsets) and the toolsets it may use: other toolsets, and agents that use them, are not found (404)."
      },
      "session": {
        "type": "apiKey",
        "in": "cookie",
        "name": "__Host-agentkit_session",
        "description": "A local user's session (POST /v1/auth/login), for the console; agentkit_session over plain HTTP. Its scopes come from the user's roles: user has agent:read and agent:run; admin adds agent:admin and admin:*. A request with a method other than GET also needs the server's own Origin and the CSRF token of GET /v1/auth/me in X-Agentkit-CSRF, else 403 csrf_failed. A bearer token, if sent, is used instead."
      }
    },
    "schemas": {
      "Error": {
        "type": "object",
        "description": "A typed error: an HTTP error's body, a failed run's error, or a run_error event's.",
        "properties": {
          "code": {
            "type": "string",
            "description": "What went wrong, for programs: invalid_request, invalid_definition (400), unauthorized (401), forbidden, csrf_failed (403), not_found (404), too_large (413), too_many_attempts, too_many_background_runs (429), conversation_busy, agent_mismatch, run_final, run_leased, awaiting_decision, not_pending, shape_changed, toolset_exists, conflict, read_only, version_published (409), auth_required, server_unreachable (422), over_capacity, shutting_down (503), internal (500); a run's codes are interrupted, run_failed, suspended (a flow run waits for a decision, a chat run for input), rejected, budget_exceeded, max_tokens, refused, unexpected_stop, cancelled, timeout, wall_clock_limit (a background run passed its wall-clock limit, and failed), shutdown, rate_limited, overloaded, model_auth, context_too_long, model_rejected and internal. conversation_interrupted is no longer returned. New codes may be added: treat an unknown one as internal."
          },
          "message": {
            "type": "string",
            "description": "What went wrong, for people. Do not parse it."
          },
          "retryable": {
            "type": "boolean",
            "description": "The same request may succeed later."
          },
          "category": {
            "type": "string",
            "description": "A refusal's category (code refused)."
          },
          "explanation": {
            "type": "string",
            "description": "A refusal's explanation (code refused)."
          },
          "run_id": {
            "type": "string",
            "description": "The run a 409 is about: the conversation's unfinished run, or the run the command named."
          },
          "fields": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/FieldError"
            },
            "description": "What is wrong with which field of a refused agent definition (code invalid_definition)."
          }
        },
        "required": [
          "code",
          "message"
        ]
      },
      "ErrorResponse": {
        "type": "object",
        "description": "The body of every HTTP error.",
        "properties": {
          "v": {
            "const": 1,
            "description": "The wire format version."
          },
          "error": {
            "$ref": "#/components/schemas/Error"
          }
        },
        "required": [
          "v",
          "error"
        ]
      },
      "Usage": {
        "type": "object",
        "description": "Tokens a run or turn used.",
        "properties": {
          "input_tokens": {
            "type": "integer"
          },
          "output_tokens": {
            "type": "integer"
          },
          "cache_read_tokens": {
            "type": "integer"
          },
          "cache_write_tokens": {
            "type": "integer"
          }
        },
        "required": [
          "input_tokens",
          "output_tokens"
        ]
      },
      "TextBlock": {
        "type": "object",
        "properties": {
          "type": {
            "const": "text"
          },
          "text": {
            "type": "string"
          }
        },
        "required": [
          "type",
          "text"
        ]
      },
      "ToolUseBlock": {
        "type": "object",
        "properties": {
          "type": {
            "const": "tool_use"
          },
          "id": {
            "type": "string"
          },
          "name": {
            "type": "string"
          },
          "input": {
            "description": "The tool's input: any JSON value."
          }
        },
        "required": [
          "type",
          "id",
          "name",
          "input"
        ]
      },
      "ToolResultBlock": {
        "type": "object",
        "properties": {
          "type": {
            "const": "tool_result"
          },
          "tool_use_id": {
            "type": "string"
          },
          "content": {
            "type": "string"
          },
          "is_error": {
            "type": "boolean"
          },
          "loads": {
            "type": "array",
            "items": {
              "type": "string"
            },
            "description": "Deferred tools this result loaded (a tool_search, or a skill that lists tools): the model has them from then on."
          }
        },
        "required": [
          "type",
          "tool_use_id",
          "content"
        ]
      },
      "OpaqueBlock": {
        "type": "object",
        "properties": {
          "type": {
            "const": "opaque"
          },
          "provider": {
            "type": "string"
          },
          "data": {
            "type": "string",
            "description": "The provider's block (Claude's thinking, say), passed back as is."
          }
        },
        "required": [
          "type",
          "provider",
          "data"
        ]
      },
      "Message": {
        "type": "object",
        "description": "A message of a conversation.",
        "properties": {
          "role": {
            "enum": [
              "user",
              "assistant"
            ]
          },
          "content": {
            "type": "array",
            "items": {
              "oneOf": [
                {
