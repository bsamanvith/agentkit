<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>agentkit Console Mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* agentkit console, mockup v3 (T070), approved by the owner on 2026-10-12 after the review fixes.
   The token block is the one in docs/UI.md "Tokens"; packages/ui (T078) takes it, prefixed --ak-, and maps shadcn's variables to it.
   The app sits in a resizable frame, and its layout uses container queries on that frame,
   so the mockup can show desktop, laptop and phone widths side by side with the real page.
   The console uses the same breakpoints as media queries. This file is plain HTML and JS so it opens anywhere; the console is React (E11). */
:root {
  --bg: #f4f4f5;
  --surface: #ffffff;
  --surface-2: #fafafa;
  --hover: #ececee;
  --surface-hover: #f4f4f5;
  --select: #e7e7ea;
  --text: #0a0a0a;
  --text-2: #3f3f46;
  --muted: #63636b;
  --faint: #a1a1aa;
  --line: #e4e4e7;
  --line-strong: #d4d4d8;
  --control: #8a8a93;
  --focus: #0a0a0a;
  --primary: #0a0a0a;
  --on-primary: #ffffff;
  --ok: #137333;
  --warn: #9a5800;
  --bad: #b91c1c;
  --font-ui: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "Geist Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --text-xs: 12px; --text-sm: 13px; --text-md: 14px; --text-lg: 16px; --text-xl: 20px; --text-2xl: 24px;
  --leading: 1.55; --leading-tight: 1.3;
  --s-1: 4px; --s-2: 8px; --s-3: 12px; --s-4: 16px; --s-5: 20px; --s-6: 24px; --s-8: 32px; --s-10: 40px;
  --r-sm: 6px; --r-md: 8px; --r-lg: 12px; --r-full: 999px;
  --rail-w: 56px; --list-w: 288px; --list-w-laptop: 248px; --chat-w: 720px; --detail-w: 880px;
  --ease: cubic-bezier(.2, 0, 0, 1); --fast: 120ms; --slow: 240ms;
  --shadow: 0 8px 24px rgba(0,0,0,.10), 0 1px 3px rgba(0,0,0,.08);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b0b0c; --surface: #141415; --surface-2: #1a1a1c;
    --hover: #1c1c1f; --surface-hover: #1c1c1f; --select: #232327;
    --text: #ededee; --text-2: #c8c8cc; --muted: #9a9aa2; --faint: #3a3a40;
    --line: #26262a; --line-strong: #34343a; --control: #6b6b73; --focus: #ededee;
    --primary: #ededee; --on-primary: #0b0b0c;
    --ok: #4ade80; --warn: #facc15; --bad: #f87171;
    --shadow: 0 8px 24px rgba(0,0,0,.5), 0 0 0 1px #26262a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b0b0c; --surface: #141415; --surface-2: #1a1a1c;
  --hover: #1c1c1f; --surface-hover: #1c1c1f; --select: #232327;
  --text: #ededee; --text-2: #c8c8cc; --muted: #9a9aa2; --faint: #3a3a40;
  --line: #26262a; --line-strong: #34343a; --control: #6b6b73; --focus: #ededee;
  --primary: #ededee; --on-primary: #0b0b0c;
  --ok: #4ade80; --warn: #facc15; --bad: #f87171;
  --shadow: 0 8px 24px rgba(0,0,0,.5), 0 0 0 1px #26262a;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font-family: var(--font-ui); font-size: var(--text-md); line-height: var(--leading); -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
code, pre, .mono { font-family: var(--font-mono); font-size: 12.5px; }
h1, h2, h3 { margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
h1 { font-size: var(--text-xl); font-weight: 600; line-height: var(--leading-tight); }
h2 { font-size: var(--text-md); font-weight: 600; }
h3 { font-size: var(--text-md); font-weight: 600; }
p { margin: 0; }
[hidden] { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.label { font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 500; }
.muted { color: var(--muted); }
svg.i { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- Mockup controls (not part of the console) ---------- */
.devbar { flex: none; display: flex; gap: 8px 14px; flex-wrap: wrap; align-items: center; padding: 6px 12px; font-size: 12px; color: var(--muted); background: var(--surface); border-bottom: 1px solid var(--line); }
.devbar b { color: var(--text); font-weight: 600; }
.devbar .grp { display: inline-flex; align-items: center; gap: 6px; }
.seg { display: inline-flex; border: 1px solid var(--control); border-radius: var(--r-full); overflow: hidden; }
.seg button { background: none; border: 0; padding: 2px 10px; font-size: 12px; color: var(--muted); min-height: 24px; }
.seg button[aria-pressed="true"] { background: var(--primary); color: var(--on-primary); }
.devbar select { font-size: 12px; padding: 2px 6px; min-height: 24px; border: 1px solid var(--control); border-radius: var(--r-sm); background: var(--surface); }
.devbar label { display: inline-flex; gap: 5px; align-items: center; }

.stage { flex: 1; min-height: 0; overflow: auto; display: flex; justify-content: center; background: var(--bg); }
.stage.framed { padding: 16px; background: repeating-linear-gradient(45deg, transparent 0 8px, var(--line) 8px 9px), var(--bg); }
.frame { container-type: inline-size; container-name: app; width: 100%; height: 100%; flex: none; }
.stage.framed .frame { border: 1px solid var(--line-strong); border-radius: 12px; overflow: hidden; box-shadow: var(--shadow); height: auto; min-height: 640px; }
.frame-label { position: sticky; left: 0; }

/* ---------- App shell ---------- */
.app { position: relative; height: 100%; display: grid; grid-template-columns: var(--rail-w) var(--list-w) minmax(0, 1fr); background: var(--bg); overflow: hidden; }
.app.no-list { grid-template-columns: var(--rail-w) minmax(0, 1fr); }
.app.no-list .list { display: none; }
.skip { position: absolute; left: 8px; top: -60px; z-index: 50; background: var(--primary); color: var(--on-primary); padding: 6px 12px; border-radius: var(--r-md); text-decoration: none; }
.skip:focus { top: 8px; }
.skips { position: absolute; top: 0; left: 0; } /* out of the grid, so it never takes a column */

.rail { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 12px 0; border-right: 1px solid var(--line); background: var(--bg); min-height: 0; }
.brand-mark { width: 28px; height: 28px; border-radius: 7px; background: var(--primary); color: var(--on-primary); display: grid; place-items: center; font-family: var(--font-mono); font-size: 12px; font-weight: 500; margin-bottom: 10px; flex: none; }
.rail-btn { position: relative; width: 40px; height: 40px; border-radius: var(--r-md); border: 0; background: none; color: var(--muted); display: grid; place-items: center; text-decoration: none; }
.rail-btn svg.i { width: 18px; height: 18px; }
.rail-btn:hover { background: var(--hover); color: var(--text); }
.rail-btn[aria-current="page"] { background: var(--select); color: var(--text); }
.rail-btn .badge { position: absolute; top: 3px; right: 2px; min-width: 18px; height: 18px; padding: 0 4px; border-radius: var(--r-full); background: var(--primary); color: var(--on-primary); font-size: 12px; font-weight: 600; display: grid; place-items: center; font-variant-numeric: tabular-nums; }
.rail-btn .tip { position: absolute; left: 48px; top: 50%; transform: translateY(-50%); background: var(--primary); color: var(--on-primary); font-size: 12px; padding: 3px 8px; border-radius: var(--r-sm); white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity var(--fast); z-index: 30; }
.rail-btn:hover .tip, .rail-btn:focus-visible .tip { opacity: 1; }
.rail-sep { width: 24px; height: 1px; background: var(--line-strong); margin: 6px 0; flex: none; }
.rail .grow { flex: 1; }
.avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--select); color: var(--text); display: grid; place-items: center; font-size: 12px; font-weight: 600; }
.later-tag { font-size: 12px; font-weight: 500; letter-spacing: .04em; color: var(--muted); border: 1px dashed var(--control); border-radius: var(--r-sm); padding: 0 5px; white-space: nowrap; }

/* List column */
.list { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--bg); border-right: 1px solid var(--line); }
.list-head { padding: 12px 12px 8px; display: flex; flex-direction: column; gap: 8px; }
.list-title { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 28px; padding: 0 4px; }
.list-title h2 { font-size: var(--text-md); }
.sections-tabs { display: none; }
.search { display: flex; align-items: center; gap: 6px; background: var(--surface); border: 1px solid var(--control); border-radius: var(--r-md); padding: 0 8px; color: var(--muted); }
.search:focus-within { outline: 2px solid var(--focus); outline-offset: 1px; }
.search input, .search input[type="search"] { border: 0; min-height: 0; border-radius: 0; background: transparent; outline: none; padding: 5px 0; min-width: 0; flex: 1; color: var(--text); font-size: var(--text-sm); }
.search kbd { font-family: var(--font-ui); font-size: 12px; color: var(--muted); border: 1px solid var(--line-strong); border-radius: 4px; padding: 0 4px; }
.filters { display: flex; gap: 6px; }
.filters select { flex: 1; min-width: 0; }
select, input[type="text"], input[type="password"], input[type="search"], input[type="date"], textarea.field { background: var(--surface); border: 1px solid var(--control); border-radius: var(--r-md); padding: 5px 10px; font-size: var(--text-sm); min-height: 32px; }
.list-body { flex: 1; min-height: 0; overflow: auto; padding: 0 8px 12px; }
.group-label { padding: 12px 8px 4px; }
.row { position: relative; display: flex; align-items: center; gap: 8px; width: 100%; border: 0; background: none; text-align: left; border-radius: var(--r-md); padding: 6px 8px; color: var(--text-2); min-height: 40px; text-decoration: none; }
.row:hover { background: var(--hover); color: var(--text); }
.row[aria-current="page"] { background: var(--select); color: var(--text); }
.row .main { min-width: 0; flex: 1; display: flex; flex-direction: column; }
.row .t { font-size: var(--text-sm); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .sub { font-size: var(--text-xs); color: var(--muted); display: flex; gap: 6px; min-width: 0; overflow: hidden; white-space: nowrap; }
.row .sub .mono { font-size: 12px; overflow: hidden; text-overflow: ellipsis; }
.row-wrap { position: relative; }
.row-wrap .more { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); opacity: 0; }
.row-wrap:hover .more, .row-wrap:focus-within .more, .row-wrap .more[aria-expanded="true"] { opacity: 1; }
@media (hover: none) { .row-wrap .more { opacity: 1; } }
.mark { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.mark.warn { background: var(--warn); }
.mark.unread { background: var(--text); }
.group-h { margin: 0; font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 500; padding: 12px 8px 4px; }
.conv-ul { list-style: none; margin: 0; padding: 0; }
.list-foot { display: none; }
.load-more { text-align: center; padding: 10px; font-size: var(--text-xs); color: var(--muted); }

/* Content */
.content { position: relative; min-width: 0; min-height: 0; display: flex; flex-direction: column; background: var(--surface); }
.offline { flex: none; display: flex; align-items: center; gap: 8px; justify-content: center; padding: 6px 16px; font-size: var(--text-sm); background: var(--surface-2); border-bottom: 1px solid var(--line); color: var(--text-2); }
.view { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.head { flex: none; display: flex; align-items: center; gap: 8px; min-height: 52px; padding: 8px 16px; border-bottom: 1px solid var(--line); }
.head .title { min-width: 0; flex: 1; font-weight: 500; font-size: var(--text-md); line-height: var(--leading); letter-spacing: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.head .title:focus { outline: none; }
.head-break { display: none; }
.icon-btn { width: 32px; height: 32px; border-radius: var(--r-md); border: 0; background: none; color: var(--muted); display: inline-grid; place-items: center; flex: none; }
.icon-btn:hover { background: var(--surface-hover); color: var(--text); }
.list .icon-btn:hover { background: var(--hover); }
.icon-btn[aria-expanded="true"] { background: var(--select); color: var(--text); }
.only-phone { display: none !important; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line-strong); background: var(--surface); border-radius: var(--r-md); padding: 5px 12px; min-height: 32px; font-weight: 500; font-size: var(--text-sm); color: var(--text); white-space: nowrap; }
.btn:hover { background: var(--surface-hover); }
.btn.primary { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
.btn.primary:hover { opacity: .88; }
.btn.ghost { border-color: transparent; background: none; }
.btn.ghost:hover { background: var(--surface-hover); }
.btn.sm { min-height: 28px; padding: 3px 10px; font-size: var(--text-xs); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.block { width: 100%; }
.list .btn { background: var(--surface); }

.status { display: inline-flex; align-items: center; gap: 6px; font-size: var(--text-sm); color: var(--text-2); white-space: nowrap; }
.status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); flex: none; }
.status.ok::before { background: var(--ok); }
.status.warn::before { background: var(--warn); }
.status.bad::before { background: var(--bad); }
.status.run::before { width: 9px; height: 9px; background: none; border: 1.5px solid var(--line-strong); border-top-color: var(--text); animation: rot .8s linear infinite; }
.tag { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--line); border-radius: var(--r-sm); padding: 0 6px; font-family: var(--font-mono); font-size: 12px; color: var(--text-2); background: var(--surface-2); white-space: nowrap; text-decoration: none; }
button.tag { min-height: 24px; }
.kbd { font-family: var(--font-ui); font-size: 12px; border: 1px solid var(--line-strong); border-bottom-width: 2px; border-radius: 5px; padding: 0 5px; background: var(--surface-2); color: var(--text-2); white-space: nowrap; }

/* Chat */
.agent-btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line-strong); background: var(--surface); border-radius: var(--r-md); padding: 3px 6px 3px 8px; min-height: 30px; font-family: var(--font-mono); font-size: 12.5px; color: var(--text); flex: none; max-width: 46%; }
.agent-btn span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.agent-btn:hover { background: var(--surface-hover); }
.agent-btn.chip { border-color: var(--line); background: var(--surface-2); }
.agent-btn .chev-d { color: var(--muted); }
.thread-wrap { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; }
.thread { flex: 1; min-height: 0; overflow: auto; padding: 28px 24px 12px; }
.thread-inner { max-width: var(--chat-w); margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
.msg-user { align-self: flex-end; max-width: 80%; background: var(--select); border-radius: 14px; padding: 9px 14px; color: var(--text); white-space: pre-wrap; overflow-wrap: anywhere; }
.msg-user.pending { color: var(--muted); }
.thinking { display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: var(--text-sm); }
.msg-ai { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.prose { display: flex; flex-direction: column; gap: 10px; overflow-wrap: anywhere; }
.prose h3 { font-size: var(--text-lg); margin-top: 6px; }
.prose ul { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; }
.prose code { background: var(--surface-2); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
.prose pre { margin: 0; padding: 10px 12px; background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-md); overflow-x: auto; white-space: pre; }
.prose pre code { border: 0; padding: 0; background: none; }
.caret { display: inline-block; width: 7px; height: 15px; background: var(--text); vertical-align: -2px; margin-left: 2px; animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.meta { color: var(--muted); font-size: var(--text-xs); font-variant-numeric: tabular-nums; display: flex; gap: 4px 10px; flex-wrap: wrap; align-items: center; }
.msg-actions { display: flex; gap: 2px; margin-left: -6px; }
.msg-actions .icon-btn { width: 28px; height: 28px; }
.note { color: var(--muted); font-size: var(--text-sm); }
.jump { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); display: inline-flex; gap: 6px; align-items: center; border: 1px solid var(--line-strong); background: var(--surface); color: var(--text); border-radius: var(--r-full); padding: 4px 12px; font-size: var(--text-xs); box-shadow: var(--shadow); }

/* Tool steps */
.steps { display: flex; flex-direction: column; }
.steps-head { display: flex; align-items: center; gap: 8px; background: none; border: 0; padding: 4px 6px; margin-left: -6px; border-radius: var(--r-md); color: var(--muted); font-size: var(--text-sm); text-align: left; align-self: flex-start; max-width: 100%; }
.steps-head:hover { color: var(--text); background: var(--surface-hover); }
.steps-head .sum { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.steps-body { border-left: 1px solid var(--line-strong); margin-left: 7px; padding-left: 14px; display: flex; flex-direction: column; gap: 1px; }
.step { display: flex; flex-direction: column; min-width: 0; }
.step-row { display: flex; align-items: center; gap: 9px; width: 100%; background: none; border: 0; border-radius: var(--r-md); padding: 5px 8px; margin-left: -8px; text-align: left; color: var(--text-2); min-width: 0; min-height: 30px; }
.step-row:hover { background: var(--surface-hover); }
.step-row .verb { color: var(--text); white-space: nowrap; }
.step-row .what { color: var(--muted); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
.step-row .took { color: var(--muted); font-size: var(--text-xs); font-variant-numeric: tabular-nums; white-space: nowrap; }
.chev { color: var(--muted); display: inline-flex; transition: transform var(--fast) var(--ease); }
[aria-expanded="true"] > .chev { transform: rotate(90deg); }
.step.err .verb, .step.err .step-row > svg.i { color: var(--bad); }
.step.stopped .verb, .step.stopped .step-row > svg.i { color: var(--muted); }
.step.running .verb { background: linear-gradient(90deg, var(--muted) 0%, var(--text) 50%, var(--muted) 100%); background-size: 200% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: shimmer 1.4s linear infinite; }
@keyframes shimmer { to { background-position: -200% 0; } }
.spin { width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid var(--line-strong); border-top-color: var(--text); animation: rot .8s linear infinite; flex: none; }
@keyframes rot { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) {
  .step.running .verb { animation: none; color: var(--muted); background: none; }
  .spin, .status.run::before { animation: none; }
  .caret { animation: none; }
  .skel { animation: none !important; }
  * { transition: none !important; }
}
.step-detail { margin: 4px 0 8px 17px; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r-md); background: var(--surface-2); display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.params { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 3px 14px; font-size: var(--text-sm); margin: 0; }
.params dt { color: var(--muted); font-family: var(--font-mono); font-size: 12px; padding-top: 1px; }
.params dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.hits { display: flex; flex-direction: column; gap: 8px; }
.hit { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 2px 8px; align-items: start; }
.fav { width: 18px; height: 18px; border-radius: 4px; background: var(--select); color: var(--text-2); display: grid; place-items: center; font-size: 10px; font-weight: 600; text-transform: uppercase; margin-top: 2px; }
.hit a { color: var(--text); text-decoration: none; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hit a:hover { text-decoration: underline; }
.hit small { grid-column: 2; color: var(--muted); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.link-btn { justify-self: start; background: none; border: 0; padding: 0; min-height: 24px; color: var(--muted); font-size: var(--text-xs); text-decoration: underline; text-underline-offset: 2px; align-self: flex-start; }
.link-btn:hover { color: var(--text); }
pre.raw { margin: 0; padding: 8px 10px; border-radius: var(--r-sm); background: var(--surface); border: 1px solid var(--line); overflow: auto; max-height: 260px; white-space: pre-wrap; word-break: break-word; }
.sources { display: flex; flex-wrap: wrap; gap: 6px; }

/* Notices and inline errors */
.notice { display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--line-strong); border-radius: var(--r-lg); padding: 10px 12px; background: var(--surface-2); font-size: var(--text-sm); color: var(--text-2); }

/* Composer */
.composer { flex: none; padding: 8px 24px 14px; }
.composer-inner { max-width: var(--chat-w); margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }

.composer.disabled form { background: var(--surface-2); }
.send { width: 32px; height: 32px; border-radius: 9px; border: 0; background: var(--primary); color: var(--on-primary); display: grid; place-items: center; flex: none; }

.hint { color: var(--muted); font-size: var(--text-xs); text-align: center; }
.hint.reason { color: var(--text-2); }

/* New chat empty state */
.empty { margin: auto; max-width: 460px; text-align: center; display: flex; flex-direction: column; gap: 10px; align-items: center; padding: 24px 16px; }
.empty .ico { width: 40px; height: 40px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); display: grid; place-items: center; color: var(--muted); }
.empty p { color: var(--muted); }
.agent-card { border: 1px solid var(--line); border-radius: var(--r-lg); padding: 14px 16px; text-align: left; display: flex; flex-direction: column; gap: 8px; width: 100%; background: var(--surface); }
.agent-card .top { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }

/* A2UI surface */
.surface { border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--surface); padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.surface-tag { display: flex; justify-content: space-between; gap: 8px; align-items: center; flex-wrap: wrap; }
.surface .srow { display: flex; gap: 10px; flex-wrap: wrap; }
.surface label { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; color: var(--muted); flex: 1; min-width: 140px; }
.chip-pick { display: flex; flex-wrap: wrap; gap: 6px; }
.chip-pick button { border: 1px solid var(--control); background: var(--surface); border-radius: var(--r-full); padding: 2px 12px; min-height: 28px; font-size: 12.5px; color: var(--text-2); }

.surface.sent, .surface.unused { background: var(--surface-2); }

/* Pages (admin) */
.page { flex: 1; min-height: 0; overflow: auto; }

.page-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
.page-head p { margin-top: 4px; color: var(--muted); max-width: 62ch; }
.section { display: flex; flex-direction: column; gap: 10px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); }
.api { color: var(--muted); font-family: var(--font-mono); font-size: 12px; overflow-wrap: anywhere; }
.kv { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 8px 14px; font-size: var(--text-sm); margin: 0; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; min-width: 0; }

.copy-line { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.copy-line code { background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 4px 8px; min-width: 0; overflow-x: auto; white-space: nowrap; max-width: 100%; flex: 1; }
.tools details { border-top: 1px solid var(--line); }

.tools summary::-webkit-details-marker { display: none; }

.tools summary span { color: var(--muted); min-width: 0; font-size: var(--text-sm); }
.fields { padding: 0 14px 14px 14px; display: grid; gap: 6px; }
.field-row { display: grid; grid-template-columns: minmax(120px, 190px) 80px minmax(0, 1fr); gap: 10px; font-size: var(--text-sm); }
.field-row .ty { color: var(--muted); font-family: var(--font-mono); font-size: 12px; }
.req { color: var(--muted); font-size: 12px; margin-left: 6px; font-family: var(--font-ui); }

.seg-tabs { display: flex; gap: 2px; background: var(--hover); border-radius: var(--r-md); padding: 2px; }
.seg-tabs button { flex: 1; border: 0; background: none; border-radius: var(--r-sm); padding: 3px 8px; font-size: var(--text-xs); color: var(--muted); min-height: 26px; }

/* Skeletons */
.skel { background: linear-gradient(90deg, var(--hover) 0%, var(--select) 50%, var(--hover) 100%); background-size: 200% 100%; animation: shimmer 1.4s linear infinite; border-radius: var(--r-sm); }

.skel-row { display: flex; flex-direction: column; gap: 6px; padding: 9px 8px; }

/* Layers: popovers, sheets, dialogs, toast */
.scrim { position: absolute; inset: 0; background: rgba(0,0,0,.32); z-index: 25; }
.pop { position: absolute; z-index: 40; background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--r-lg); box-shadow: var(--shadow); min-width: 220px; max-width: min(360px, calc(100% - 16px)); padding: 6px; display: flex; flex-direction: column; gap: 2px; }
.pop.sheet { left: 0 !important; right: 0; bottom: 0; top: auto !important; max-width: none; border-radius: 16px 16px 0 0; padding: 8px 8px calc(12px + env(safe-area-inset-bottom, 0px)); max-height: 80%; overflow: auto; }

/* Connections */

}

  .copy-line code { white-space: pre-wrap; word-break: break-all; }
  .list-foot { display: flex; align-items: center; gap: 10px; padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); }
  .row { min-height: 44px; }

  .not-phone { display: none !important; }

  .thread { padding: 20px 16px 8px; }
  .composer { padding: 6px 16px calc(12px + env(safe-area-inset-bottom, 0px)); }

  .page-inner { padding: 16px; }

  .kv { grid-template-columns: minmax(0, 1fr); gap: 0; }

  .agent-btn { max-width: 60%; }
  .hint.keys-hint { display: none; }
  .tbl-cards thead { display: none; }
  .tbl-cards tr { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; padding: 12px 14px; border-bottom: 1px solid var(--line); }

  .tbl-cards td { padding: 0; border: 0; }
  .tbl-cards td[data-wide] { grid-column: 1 / -1; }

}

}

/* ============ Navigation ============ */
// Leaving a conversation never stops its run; the run keeps streaming into the app-level store.
function openConv(id) {
  S.section = "chats"; S.conv = id; S.drawer = false;
  if (S.state === "404") { S.state = "normal"; $("#dv-state").value = "normal"; }
  const c = convById(id); if (c) c.unread = false;
  render(); focusHeading();
}
function newChat() {
  S.section = "chats"; S.conv = null; S.drawer = false;
  if (S.state === "404") { S.state = "normal"; $("#dv-state").value = "normal"; }
  if (!agentByName(S.newAgent)) S.newAgent = "researcher";
  render();
  // Desktop: straight to the message box. Phone: the heading, so the keyboard doesn't cover the agent card.
  if (S.mode === "phone") focusHeading(); else focusComposer();
}
function focusSearch() {
  if (S.section !== "chats" || S.listOff || S.mode === "phone") { S.section = "chats"; S.listOff = false; if (S.mode === "phone") S.drawer = true; render(); }
  const f = $("#conv-search"); if (f) { f.focus(); f.select(); }
}

/* ============ Keyboard ============ */
// The platform's modifier only (⌘ or Ctrl, never both, never Alt); no key repeat; letters by e.code so layouts agree.
document.addEventListener("keydown", e => {
  if (e.target.closest && e.target.closest(".devbar")) return;
  if (e.repeat || e.isComposing) return;
  const modal = !!S.signin || (layer && layer.nodes.some(n => n.classList.contains("dialog")));
  if (e.key === "Escape") {
    if (S.signin) return; // nothing to close behind the sign-in card
    if (closeLayers()) { e.preventDefault(); return; }
    if (S.drawer) { e.preventDefault(); S.drawer = false; render(); return; }
    if (runHere()) { e.preventDefault(); stopRun(); return; }
    return;
  }
  if (modal) return; // a dialog takes only Esc and its own keys
  const mod = MAC ? e.metaKey && !e.ctrlKey : e.ctrlKey && !e.metaKey;
  if (e.altKey) return;
  const inField = e.target.closest && e.target.closest("input, textarea, select, [contenteditable]");
  if (mod && e.shiftKey && e.code === "KeyO") { e.preventDefault(); newChat(); return; }
  if (mod && !e.shiftKey && e.code === "KeyK") { e.preventDefault(); closeLayers(false); focusSearch(); return; }
  if (mod && e.shiftKey && e.code === "KeyS") { e.preventDefault(); toggleList(); return; }
  if (mod && e.code === "Slash") { e.preventDefault(); showShortcuts(); return; }
  if (inField || e.metaKey || e.ctrlKey || !S.singleKeys) return;
  if (e.key === "?" || (e.code === "Slash" && e.shiftKey)) { e.preventDefault(); showShortcuts(); return; }
  if (e.key === "/") { e.preventDefault(); focusComposer(); }
});

/* ============ Mockup controls ============ */
function setTheme(v) {
  if (v) document.documentElement.setAttribute("data-theme", v); else document.documentElement.removeAttribute("data-theme");
  document.querySelectorAll("#dv-theme button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.v === v)));
  try { localStorage.setItem("ak-mock-theme", v); } catch (e) { /* storage blocked: the default theme is fine */ }
}
function seg(id, fn) { document.querySelectorAll("#" + id + " button").forEach(b => b.addEventListener("click", () => { document.querySelectorAll("#" + id + " button").forEach(x => x.setAttribute("aria-pressed", String(x === b))); fn(b.dataset.v); })); }
seg("dv-theme", setTheme);
seg("dv-role", v => { S.role = v; if (!isAdmin() && ["agents", "toolsets"].includes(S.section)) S.section = "chats"; render(); });
seg("dv-width", v => {
  const st = $("#stage"), fr = $("#frame");
  if (v === "fit") { st.classList.remove("framed"); fr.style.width = ""; fr.style.height = ""; }
  else { st.classList.add("framed"); fr.style.width = v + "px"; fr.style.height = v === "400" ? "820px" : "760px"; }
  S.drawer = false;
});
$("#dv-later").addEventListener("change", e => { S.later = e.target.checked; if (!S.later && S.section === "activity") S.section = "chats"; if (!S.later && S.conv === "conv_bg91dd") S.conv = "conv_7f3k2q"; render(); });
$("#dv-state").addEventListener("change", e => applyState(e.target.value));

function applyState(st) {
  if (S.run) { clearInterval(S.run.timer); S.run = null; }
  stopRetry();
  S.mine = MINE0(); S.org = ORG0(); S.connWait = null; S.connErr = null; S.rejectNext = false;
  S.state = st; S.signin = null; S.drawer = false; S.threads = {}; S.deleted.clear(); S.search = ""; S.filterAgent = ""; S.drafts = {}; S.pending = null; S.busyChecks = 0;
  CONVS_ALL.forEach(c => { delete c.resumed; delete c.unread; });
  const si = (card, err, extra) => { S.state = "normal"; S.signin = { card, reason: null, err, both: false, ...extra }; };
  const go = (section, conv) => { S.section = section; if (conv !== undefined) S.conv = conv; };
  switch (st) {
    case "normal": go("chats", "conv_7f3k2q"); break;
    case "streaming": go("chats", "conv_7f3k2q"); render(); startRun("And what changed in the runtime?"); return;
    case "long": go("chats", "conv_long01"); S.scrollTop = "top"; break;
    case "signin": si("password", null); break;
    case "signin-error": si("password", "wrong"); break;
    case "signin-throttled": si("password", "throttled"); break;
    case "signin-unreachable": si("password", "unreachable"); break;
    case "signin-both": si("password", null, { both: true }); break;
    case "token": si("token", null); break;
    case "token-error": si("token", "token"); break;
    case "401": go("chats", "conv_7f3k2q"); S.drafts.conv_7f3k2q = "Can you also check the 1.26.1 patch notes?"; si("password", null, { reason: "401" }); break;
    case "empty": go("chats", null); break;
    case "no-agents": go("chats", null); break;
    case "load-failed": go("chats", "conv_7f3k2q"); break;
    case "agent-removed": S.state = "normal"; go("chats", "conv_s0rm1x"); break;
    case "loading": if (S.section === "activity") go("chats", "conv_7f3k2q"); if (S.section === "chats" && !S.conv) S.conv = "conv_7f3k2q"; break;
    case "403": S.role = "user"; document.querySelectorAll("#dv-role button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.v === "user"))); go("agents"); break;
    case "404": go("chats", "conv_9zz0q1"); break;
    case "busy": go("chats", "conv_q81mzc"); break;
    case "interrupted": go("chats", "conv_k4p9xe"); break;
    case "503": case "503-restart": case "err-rate": case "err-refused": case "err-context": case "lost": case "tool-failed": go("chats", "conv_7f3k2q"); break;
    case "too-large": go("chats", "conv_7f3k2q"); S.drafts.conv_7f3k2q = "Here is the full log:\n2026-10-12T09:14:03Z INFO server starting…\n(about 3 MB more pasted)"; break;
    case "offline": go("chats", "conv_7f3k2q"); break;
    case "conn-page": S.state = "normal"; go("connections"); break;
    case "conn-chat": S.state = "normal"; go("chats", "conv_q81mzc"); break;
    case "conn-rejected": S.state = "normal"; go("connections"); render(); keyDialog(connOf("exa"), "me", $("#conn-act-exa"), true); return;
    case "conn-waiting": S.state = "normal"; go("connections"); startOAuth(connOf("github"), "me"); return;
    case "conn-denied": S.state = "normal"; go("connections"); S.connErr = { ts: "github", text: "You didn't allow access. Nothing was saved." }; break;
    case "conn-expired": S.state = "normal"; go("connections"); S.connErr = { ts: "github", text: "Connecting took too long or failed. Try again." }; break;
    case "notify":
      S.state = "normal"; go("chats", "conv_7f3k2q"); render();
      if (S.later) toast("Background run finished: Summarize yesterday's incidents", ["Open", () => { S.section = "activity"; S.actTab = "runs"; S.actSel = "run_1q9wze"; render(); }]);
      else toast("Turn on “Show later features” to see notifications");
      $("#dv-state").value = "normal";
      return;
  }
  render();
}

/* Width mode from the frame's own width (the same breakpoints as the container queries). */
function measure() {
  const w = $("#frame").getBoundingClientRect().width;
  const m = w < 768 ? "phone" : w < 1200 ? "laptop" : "desktop";
  if (m !== S.mode) {
    S.mode = m; S.drawer = false;
    if (m !== "phone") { S.agentSel = S.agentSel || "researcher"; S.toolsetSel = S.toolsetSel || "tavily"; S.actSel = S.actSel || (S.actTab === "threads" ? THREADS[0].id : RUNS[0].id); }
    render();
  }
}
new ResizeObserver(measure).observe($("#frame"));

try { const t = localStorage.getItem("ak-mock-theme"); if (t) setTheme(t); } catch (e) { /* storage blocked */ }
applyRoute(); // a reload or a pasted link opens the same view
measure(); render();
</script>
</body>
</html>
