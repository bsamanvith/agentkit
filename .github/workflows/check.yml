name: check

on:
  push:
    branches: [main]
  pull_request:

# Every job reads the repository and nothing else; a job that needs more
# says so in its own permissions block, with the reason (none does). Actions
# are pinned to a full commit SHA with the release in a comment (T101), and
# checkout keeps no token: make workflow-lint (actionlint, zizmor) enforces it.
permissions:
  contents: read

jobs:
  # Tests, lint and the fuzz seed corpus (which go test runs like any test;
  # coverage-guided fuzzing is local only, make fuzz).
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: the checkout left no credentials in .git/config
        run: scripts/check-no-git-credentials.sh
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      # make check runs zizmor when it is installed (scripts/zizmor.sh).
      - name: install zizmor for make workflow-lint
        run: pipx install "zizmor==$(make -s print-zizmor-version)"
      - name: make check
        run: make check
        env:
          ZIZMOR_REQUIRED: "1"

  # The integration tier, required like every job here: tests built with
  # -tags integration against real dependencies. pkg/bus (T089) runs against
  # a Redis 7 service container, and against a redis-server binary that
  # TestRestart starts and restarts itself (installed, never started as a
  # service). pkg/store (T088) runs every store suite, simulation and race
  # against a Postgres 17 service container, each test in a schema of its
  # own; cmd/agentkit's migrate command runs against it too. pkg/stream (T090)
  # runs its watch, notification and command tests on the Redis bus.
  # pkg/credentials (T043) runs the vault suites on Postgres under row-level
  # security, and cmd/agentkit its credentials.backend "postgres".
  # AGENTKIT_REQUIRE_INTEGRATION turns a missing variable into a failure.
  integration:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
      postgres:
        image: postgres:17
        ports: ["5432:5432"]
        env:
          POSTGRES_USER: agentkit
          POSTGRES_PASSWORD: agentkit
          POSTGRES_DB: agentkit_test
        options: >-
          --health-cmd "pg_isready -U agentkit -d agentkit_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      AGENTKIT_REQUIRE_INTEGRATION: "1"
      AGENTKIT_REDIS_URL: redis://localhost:6379/0
      AGENTKIT_REDIS_SERVER: /usr/bin/redis-server
      AGENTKIT_PG_URL: postgres://agentkit:agentkit@localhost:5432/agentkit_test?sslmode=disable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: the checkout left no credentials in .git/config
        run: scripts/check-no-git-credentials.sh
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: Install redis-server for TestRestart, without starting it
        run: |
          printf '#!/bin/sh\nexit 101\n' | sudo tee /usr/sbin/policy-rc.d >/dev/null
          sudo chmod +x /usr/sbin/policy-rc.d
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends redis-server
          sudo rm /usr/sbin/policy-rc.d
          redis-server --version
      - name: go test -tags integration ./pkg/bus/... ./pkg/store/... ./pkg/stream/... ./pkg/credentials/...
        run: go test -race -shuffle=on -count=1 -tags integration ./pkg/bus/... ./pkg/store/... ./pkg/stream/... ./pkg/credentials/...
      - name: go test -tags integration -run '^(TestMigrate|TestE2EServeReplicas|TestCredentials)' ./cmd/agentkit/
        run: go test -race -count=1 -tags integration -run '^(TestMigrate|TestE2EServeReplicas|TestCredentials)' ./cmd/agentkit/
      # On Postgres as a role that is neither a superuser nor BYPASSRLS, owning
      # its schema: row-level security (T093, FORCE) applies to every query.
      - name: the agent API's suite on SQLite and Postgres (AGENTAPI_TEST_STORE)
        run: |
          AGENTAPI_TEST_STORE=sqlite go test -race -count=1 ./pkg/agentapi/...
          psql "$AGENTKIT_PG_URL" -v ON_ERROR_STOP=1 -c "CREATE ROLE agentkit_app LOGIN PASSWORD 'agentkit_app'" -c "CREATE SCHEMA app AUTHORIZATION agentkit_app"
          AGENTAPI_TEST_STORE="postgres://agentkit_app:agentkit_app@localhost:5432/agentkit_test?sslmode=disable&search_path=app" go test -race -count=1 ./pkg/agentapi/...

  # The image builds and stays within IMAGE_BUDGET_MB. A unit test can't see
  # a .dockerignore that leaves out a package cmd/ imports; this can. Then the
  # per-image smoke (T102): the split images run on the host's network
  # against a Postgres service, the api image migrates it (twice; the second
  # run must change nothing, scripts/migrate-check.sh) and serves it with
  # AGENTKIT_STORE_MIGRATE=off, and the smoke suite checks each image's
  # /readyz and surface and runs a chat on the fake model.
  image:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        ports: ["5432:5432"]
        env:
          POSTGRES_USER: agentkit
          POSTGRES_PASSWORD: agentkit
          POSTGRES_DB: agentkit_smoke
        options: >-
          --health-cmd "pg_isready -U agentkit -d agentkit_smoke"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: the checkout left no credentials in .git/config
        run: scripts/check-no-git-credentials.sh
      - name: make image
        run: make image BIN=agentkit
      - name: make image-size
        run: make image-size BIN=agentkit
      - name: the local and dev variants (make image-local, make image-dev)
        run: |
          make image-local && make image-size-local
          make image-dev && make image-size-dev
      - name: the split images make k8s-up deploys (make images-split)
        run: |
          make images-split
          make image-size-api && make image-size-runner && make image-size-toolsets
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: web/.nvmrc
      # The images built above, never pulled: each checked against its budget
      # again, run as containers on this Postgres, and the suite (-v, strict:
      # a skip fails) must pass every test by name. The log ends with
      # "smoke: passed: ... against the images".
      - name: per-image smoke on Postgres (scripts/smoke.sh --images)
        run: scripts/smoke.sh --images
        env:
          AGENTKIT_STORE: postgres://agentkit:agentkit@localhost:5432/agentkit_smoke?sslmode=disable
      - name: the fakellm image (make image BIN=fakellm), within its own 12 MB budget
        run: make image BIN=fakellm && make image-size BIN=fakellm

  # The web workspace (web/): lint, typecheck, unit tests, audit, and a
  # rebuild that must match the committed pkg/web/dist; then the browser
  # smoke test against agentkit serve, in the runner's Google Chrome (no
  # browser download).
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: the checkout left no credentials in .git/config
        run: scripts/check-no-git-credentials.sh
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: web/.nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: make web-check
        run: make web-check
      - name: make web-smoke
        run: make web-smoke
      - name: make smoke (the split deployment as processes, test/e2e)
        run: make smoke
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: web/apps/console/playwright-report
          retention-days: 7
