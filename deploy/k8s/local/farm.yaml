# The farm app (apps/farm) next to the split deployment, for local use: one
# pod, its SQLite files (plots, the farmers' sealed keys and its key file,
# the heights and vectors caches) on a 1 GiB volume, kept until make
# k8s-down. Its assistant uses the deployment's Anthropic key.
#
# The farm app has no sign-in, so its Service is not a node port (Docker
# Desktop publishes those on every interface, the LAN included):
# scripts/k8s-local.sh farm forwards http://127.0.0.1:30090 to it.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: farm
  labels: {app.kubernetes.io/name: agentkit, app.kubernetes.io/component: farm}
spec:
  serviceName: farm
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: agentkit, app.kubernetes.io/component: farm}
  template:
    metadata:
      labels: {app.kubernetes.io/name: agentkit, app.kubernetes.io/component: farm}
    spec:
      terminationGracePeriodSeconds: 20
      securityContext: {fsGroup: 65532}
      containers:
        - name: farm
          image: farm:latest
          imagePullPolicy: IfNotPresent
          # The binary alone: the image's default command ("serve") is
          # agentkit's.
          command: [/app]
          env:
            - {name: FARM_ADDR, value: ":8080"}
            - {name: FARM_DB, value: /data/farm.db}
            - name: ANTHROPIC_API_KEY
              valueFrom: {secretKeyRef: {name: agentkit, key: anthropic-api-key}}
          ports: [{name: http, containerPort: 8080}]
          startupProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 2, failureThreshold: 30}
          readinessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 10}
          resources:
            requests: {cpu: 20m, memory: 48Mi}
            limits: {cpu: "1", memory: 384Mi}
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: tmp, emptyDir: {}}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 1Gi}}
---
apiVersion: v1
kind: Service
metadata:
  name: farm
  labels: {app.kubernetes.io/name: agentkit, app.kubernetes.io/component: farm}
spec:
  selector: {app.kubernetes.io/name: agentkit, app.kubernetes.io/component: farm}
  ports: [{name: http, port: 8080, targetPort: http}]
