          "message": {
            "type": "string",
            "description": "The user's message; empty only to resume an interrupted conversation."
          },
          "conversation_id": {
            "type": "string",
            "description": "Continues this conversation (started by an earlier run, or created by POST /v1/conversations); absent starts a new one."
