    "/v1/auth/login": {
      "post": {
        "operationId": "login",
        "summary": "Sign in with a username and password",
        "description": "Needs no credentials. Starts a session for a local user (the config's auth.users) and sets its cookie. A session ends after 12 hours unused, 7 days after sign-in, or at POST /v1/auth/logout. A request the session authenticates with a method other than GET must send the server's own Origin and the CSRF token of GET /v1/auth/me in X-Agentkit-CSRF, else 403 csrf_failed.",
        "security": [
          {}
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/LoginRequest"
              }
