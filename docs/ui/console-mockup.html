<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>agentkit Console Mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* agentkit console, mockup v4 (T087): v3 (T070, approved by the owner on 2026-10-12) plus part 2:
   Tasks (with steering, pause and the waiting-for-you state), interrupts and approvals, policy in transcripts,
   the agent builder with versions, skills and their editor, and adding an MCP server.
   The token block is the one in docs/UI.md "Tokens"; packages/ui (T078) takes it, prefixed --ak-, and maps shadcn's variables to it.
   The app sits in a resizable frame, and its layout uses container queries on that frame,
   so the mockup can show desktop, laptop and phone widths side by side with the real page.
   The console uses the same breakpoints as media queries. This file is plain HTML and JS so it opens anywhere; the console is React (E11). */
:root {
  --bg: #f4f4f5;
  --surface: #ffffff;
  --surface-2: #fafafa;
  --hover: #ececee;
  --surface-hover: #f4f4f5;
  --select: #e7e7ea;
  --text: #0a0a0a;
  --text-2: #3f3f46;
  --muted: #63636b;
  --faint: #a1a1aa;
  --line: #e4e4e7;
  --line-strong: #d4d4d8;
  --control: #8a8a93;
  --focus: #0a0a0a;
  --primary: #0a0a0a;
  --on-primary: #ffffff;
  --ok: #137333;
  --warn: #9a5800;
  --bad: #b91c1c;
  --font-ui: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "Geist Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --text-xs: 12px; --text-sm: 13px; --text-md: 14px; --text-lg: 16px; --text-xl: 20px; --text-2xl: 24px;
  --leading: 1.55; --leading-tight: 1.3;
  --s-1: 4px; --s-2: 8px; --s-3: 12px; --s-4: 16px; --s-5: 20px; --s-6: 24px; --s-8: 32px; --s-10: 40px;
  --r-sm: 6px; --r-md: 8px; --r-lg: 12px; --r-full: 999px;
  --rail-w: 56px; --list-w: 288px; --list-w-laptop: 248px; --chat-w: 720px; --detail-w: 880px;
  --ease: cubic-bezier(.2, 0, 0, 1); --fast: 120ms; --slow: 240ms;
  --shadow: 0 8px 24px rgba(0,0,0,.10), 0 1px 3px rgba(0,0,0,.08);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b0b0c; --surface: #141415; --surface-2: #1a1a1c;
    --hover: #1c1c1f; --surface-hover: #1c1c1f; --select: #232327;
    --text: #ededee; --text-2: #c8c8cc; --muted: #9a9aa2; --faint: #3a3a40;
    --line: #26262a; --line-strong: #34343a; --control: #6b6b73; --focus: #ededee;
    --primary: #ededee; --on-primary: #0b0b0c;
    --ok: #4ade80; --warn: #facc15; --bad: #f87171;
    --shadow: 0 8px 24px rgba(0,0,0,.5), 0 0 0 1px #26262a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b0b0c; --surface: #141415; --surface-2: #1a1a1c;
  --hover: #1c1c1f; --surface-hover: #1c1c1f; --select: #232327;
  --text: #ededee; --text-2: #c8c8cc; --muted: #9a9aa2; --faint: #3a3a40;
  --line: #26262a; --line-strong: #34343a; --control: #6b6b73; --focus: #ededee;
  --primary: #ededee; --on-primary: #0b0b0c;
  --ok: #4ade80; --warn: #facc15; --bad: #f87171;
  --shadow: 0 8px 24px rgba(0,0,0,.5), 0 0 0 1px #26262a;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font-family: var(--font-ui); font-size: var(--text-md); line-height: var(--leading); -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
code, pre, .mono { font-family: var(--font-mono); font-size: 12.5px; }
h1, h2, h3 { margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
h1 { font-size: var(--text-xl); font-weight: 600; line-height: var(--leading-tight); }
h2 { font-size: var(--text-md); font-weight: 600; }
h3 { font-size: var(--text-md); font-weight: 600; }
p { margin: 0; }
[hidden] { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.label { font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 500; }
.muted { color: var(--muted); }
svg.i { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- Mockup controls (not part of the console) ---------- */
.devbar { flex: none; display: flex; gap: 8px 14px; flex-wrap: wrap; align-items: center; padding: 6px 12px; font-size: 12px; color: var(--muted); background: var(--surface); border-bottom: 1px solid var(--line); }
.devbar b { color: var(--text); font-weight: 600; }
.devbar .grp { display: inline-flex; align-items: center; gap: 6px; }
.seg { display: inline-flex; border: 1px solid var(--control); border-radius: var(--r-full); overflow: hidden; }
.seg button { background: none; border: 0; padding: 2px 10px; font-size: 12px; color: var(--muted); min-height: 24px; }
.seg button[aria-pressed="true"] { background: var(--primary); color: var(--on-primary); }
.devbar select { font-size: 12px; padding: 2px 6px; min-height: 24px; border: 1px solid var(--control); border-radius: var(--r-sm); background: var(--surface); }
.devbar label { display: inline-flex; gap: 5px; align-items: center; }

.stage { flex: 1; min-height: 0; overflow: auto; display: flex; justify-content: center; background: var(--bg); }
.stage.framed { padding: 16px; background: repeating-linear-gradient(45deg, transparent 0 8px, var(--line) 8px 9px), var(--bg); }
.frame { container-type: inline-size; container-name: app; width: 100%; height: 100%; flex: none; }
.stage.framed .frame { border: 1px solid var(--line-strong); border-radius: 12px; overflow: hidden; box-shadow: var(--shadow); height: auto; min-height: 640px; }
.frame-label { position: sticky; left: 0; }

/* ---------- App shell ---------- */
.app { position: relative; height: 100%; display: grid; grid-template-columns: var(--rail-w) var(--list-w) minmax(0, 1fr); background: var(--bg); overflow: hidden; }
.app.no-list { grid-template-columns: var(--rail-w) minmax(0, 1fr); }
.app.no-list .list { display: none; }
.skip { position: absolute; left: 8px; top: -60px; z-index: 50; background: var(--primary); color: var(--on-primary); padding: 6px 12px; border-radius: var(--r-md); text-decoration: none; }
.skip:focus { top: 8px; }
.skips { position: absolute; top: 0; left: 0; } /* out of the grid, so it never takes a column */

.rail { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 12px 0; border-right: 1px solid var(--line); background: var(--bg); min-height: 0; }
.brand-mark { width: 28px; height: 28px; border-radius: 7px; background: var(--primary); color: var(--on-primary); display: grid; place-items: center; font-family: var(--font-mono); font-size: 12px; font-weight: 500; margin-bottom: 10px; flex: none; }
.rail-btn { position: relative; width: 40px; height: 40px; border-radius: var(--r-md); border: 0; background: none; color: var(--muted); display: grid; place-items: center; text-decoration: none; }
.rail-btn svg.i { width: 18px; height: 18px; }
.rail-btn:hover { background: var(--hover); color: var(--text); }
.rail-btn[aria-current="page"] { background: var(--select); color: var(--text); }
.rail-btn .badge { position: absolute; top: 3px; right: 2px; min-width: 18px; height: 18px; padding: 0 4px; border-radius: var(--r-full); background: var(--primary); color: var(--on-primary); font-size: 12px; font-weight: 600; display: grid; place-items: center; font-variant-numeric: tabular-nums; }
.rail-btn .tip { position: absolute; left: 48px; top: 50%; transform: translateY(-50%); background: var(--primary); color: var(--on-primary); font-size: 12px; padding: 3px 8px; border-radius: var(--r-sm); white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity var(--fast); z-index: 30; }
.rail-btn:hover .tip, .rail-btn:focus-visible .tip { opacity: 1; }
.rail-sep { width: 24px; height: 1px; background: var(--line-strong); margin: 6px 0; flex: none; }
.rail .grow { flex: 1; }
.avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--select); color: var(--text); display: grid; place-items: center; font-size: 12px; font-weight: 600; }
.later-tag { font-size: 12px; font-weight: 500; letter-spacing: .04em; color: var(--muted); border: 1px dashed var(--control); border-radius: var(--r-sm); padding: 0 5px; white-space: nowrap; }

/* List column */
.list { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--bg); border-right: 1px solid var(--line); }
.list-head { padding: 12px 12px 8px; display: flex; flex-direction: column; gap: 8px; }
.list-title { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 28px; padding: 0 4px; }
.list-title h2 { font-size: var(--text-md); }
.sections-tabs { display: none; }
.search { display: flex; align-items: center; gap: 6px; background: var(--surface); border: 1px solid var(--control); border-radius: var(--r-md); padding: 0 8px; color: var(--muted); }
.search:focus-within { outline: 2px solid var(--focus); outline-offset: 1px; }
.search input, .search input[type="search"] { border: 0; min-height: 0; border-radius: 0; background: transparent; outline: none; padding: 5px 0; min-width: 0; flex: 1; color: var(--text); font-size: var(--text-sm); }
.search kbd { font-family: var(--font-ui); font-size: 12px; color: var(--muted); border: 1px solid var(--line-strong); border-radius: 4px; padding: 0 4px; }
.filters { display: flex; gap: 6px; }
.filters select { flex: 1; min-width: 0; }
select, input[type="text"], input[type="password"], input[type="search"], input[type="date"], textarea.field { background: var(--surface); border: 1px solid var(--control); border-radius: var(--r-md); padding: 5px 10px; font-size: var(--text-sm); min-height: 32px; }
.list-body { flex: 1; min-height: 0; overflow: auto; padding: 0 8px 12px; }
.group-label { padding: 12px 8px 4px; }
.row { position: relative; display: flex; align-items: center; gap: 8px; width: 100%; border: 0; background: none; text-align: left; border-radius: var(--r-md); padding: 6px 8px; color: var(--text-2); min-height: 40px; text-decoration: none; }
.row:hover { background: var(--hover); color: var(--text); }
.row[aria-current="page"] { background: var(--select); color: var(--text); }
.row .main { min-width: 0; flex: 1; display: flex; flex-direction: column; }
.row .t { font-size: var(--text-sm); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .sub { font-size: var(--text-xs); color: var(--muted); display: flex; gap: 6px; min-width: 0; overflow: hidden; white-space: nowrap; }
.row .sub .mono { font-size: 12px; overflow: hidden; text-overflow: ellipsis; }
.row-wrap { position: relative; }
.row-wrap .more { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); opacity: 0; }
.row-wrap:hover .more, .row-wrap:focus-within .more, .row-wrap .more[aria-expanded="true"] { opacity: 1; }
@media (hover: none) { .row-wrap .more { opacity: 1; } }
.mark { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.mark.warn { background: var(--warn); }
.mark.unread { background: var(--text); }
.group-h { margin: 0; font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 500; padding: 12px 8px 4px; }
.conv-ul { list-style: none; margin: 0; padding: 0; }
.list-foot { display: none; }
.load-more { text-align: center; padding: 10px; font-size: var(--text-xs); color: var(--muted); }

/* Content */
.content { position: relative; min-width: 0; min-height: 0; display: flex; flex-direction: column; background: var(--surface); }
.offline { flex: none; display: flex; align-items: center; gap: 8px; justify-content: center; padding: 6px 16px; font-size: var(--text-sm); background: var(--surface-2); border-bottom: 1px solid var(--line); color: var(--text-2); }
.view { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.head { flex: none; display: flex; align-items: center; gap: 8px; min-height: 52px; padding: 8px 16px; border-bottom: 1px solid var(--line); }
.head .title { min-width: 0; flex: 1; font-weight: 500; font-size: var(--text-md); line-height: var(--leading); letter-spacing: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.head .title:focus { outline: none; }
.head-break { display: none; }
.icon-btn { width: 32px; height: 32px; border-radius: var(--r-md); border: 0; background: none; color: var(--muted); display: inline-grid; place-items: center; flex: none; }
.icon-btn:hover { background: var(--surface-hover); color: var(--text); }
.list .icon-btn:hover { background: var(--hover); }
.icon-btn[aria-expanded="true"] { background: var(--select); color: var(--text); }
.only-phone { display: none !important; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line-strong); background: var(--surface); border-radius: var(--r-md); padding: 5px 12px; min-height: 32px; font-weight: 500; font-size: var(--text-sm); color: var(--text); white-space: nowrap; }
.btn:hover { background: var(--surface-hover); }
.btn.primary { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
.btn.primary:hover { opacity: .88; }
.btn.ghost { border-color: transparent; background: none; }
.btn.ghost:hover { background: var(--surface-hover); }
.btn.sm { min-height: 28px; padding: 3px 10px; font-size: var(--text-xs); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.block { width: 100%; }
.list .btn { background: var(--surface); }

.status { display: inline-flex; align-items: center; gap: 6px; font-size: var(--text-sm); color: var(--text-2); white-space: nowrap; }
.status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); flex: none; }
.status.ok::before { background: var(--ok); }
.status.warn::before { background: var(--warn); }
.status.bad::before { background: var(--bad); }
.status.run::before { width: 9px; height: 9px; background: none; border: 1.5px solid var(--line-strong); border-top-color: var(--text); animation: rot .8s linear infinite; }
.tag { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--line); border-radius: var(--r-sm); padding: 0 6px; font-family: var(--font-mono); font-size: 12px; color: var(--text-2); background: var(--surface-2); white-space: nowrap; text-decoration: none; }
button.tag { min-height: 24px; }
.kbd { font-family: var(--font-ui); font-size: 12px; border: 1px solid var(--line-strong); border-bottom-width: 2px; border-radius: 5px; padding: 0 5px; background: var(--surface-2); color: var(--text-2); white-space: nowrap; }

/* Chat */
.agent-btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line-strong); background: var(--surface); border-radius: var(--r-md); padding: 3px 6px 3px 8px; min-height: 30px; font-family: var(--font-mono); font-size: 12.5px; color: var(--text); flex: none; max-width: 46%; }
.agent-btn span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.agent-btn:hover { background: var(--surface-hover); }
.agent-btn.chip { border-color: var(--line); background: var(--surface-2); }
.agent-btn .chev-d { color: var(--muted); }
.thread-wrap { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; }
.thread { flex: 1; min-height: 0; overflow: auto; padding: 28px 24px 12px; }
.thread-inner { max-width: var(--chat-w); margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
.msg-user { align-self: flex-end; max-width: 80%; background: var(--select); border-radius: 14px; padding: 9px 14px; color: var(--text); white-space: pre-wrap; overflow-wrap: anywhere; }
.msg-user.pending { color: var(--muted); }
.thinking { display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: var(--text-sm); }
.msg-ai { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.prose { display: flex; flex-direction: column; gap: 10px; overflow-wrap: anywhere; }
.prose h3 { font-size: var(--text-lg); margin-top: 6px; }
.prose ul { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; }
.prose code { background: var(--surface-2); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
.prose pre { margin: 0; padding: 10px 12px; background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-md); overflow-x: auto; white-space: pre; }
.prose pre code { border: 0; padding: 0; background: none; }
.caret { display: inline-block; width: 7px; height: 15px; background: var(--text); vertical-align: -2px; margin-left: 2px; animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.meta { color: var(--muted); font-size: var(--text-xs); font-variant-numeric: tabular-nums; display: flex; gap: 4px 10px; flex-wrap: wrap; align-items: center; }
.msg-actions { display: flex; gap: 2px; margin-left: -6px; }
.msg-actions .icon-btn { width: 28px; height: 28px; }
.note { color: var(--muted); font-size: var(--text-sm); }
.jump { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); display: inline-flex; gap: 6px; align-items: center; border: 1px solid var(--line-strong); background: var(--surface); color: var(--text); border-radius: var(--r-full); padding: 4px 12px; font-size: var(--text-xs); box-shadow: var(--shadow); }

/* Tool steps */
.steps { display: flex; flex-direction: column; }
.steps-head { display: flex; align-items: center; gap: 8px; background: none; border: 0; padding: 4px 6px; margin-left: -6px; border-radius: var(--r-md); color: var(--muted); font-size: var(--text-sm); text-align: left; align-self: flex-start; max-width: 100%; }
.steps-head:hover { color: var(--text); background: var(--surface-hover); }
.steps-head .sum { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.steps-body { border-left: 1px solid var(--line-strong); margin-left: 7px; padding-left: 14px; display: flex; flex-direction: column; gap: 1px; }
.step { display: flex; flex-direction: column; min-width: 0; }
.step-row { display: flex; align-items: center; gap: 9px; width: 100%; background: none; border: 0; border-radius: var(--r-md); padding: 5px 8px; margin-left: -8px; text-align: left; color: var(--text-2); min-width: 0; min-height: 30px; }
.step-row:hover { background: var(--surface-hover); }
.step-row .verb { color: var(--text); white-space: nowrap; }
.step-row .what { color: var(--muted); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
.step-row .took { color: var(--muted); font-size: var(--text-xs); font-variant-numeric: tabular-nums; white-space: nowrap; }
.chev { color: var(--muted); display: inline-flex; transition: transform var(--fast) var(--ease); }
[aria-expanded="true"] > .chev { transform: rotate(90deg); }
.step.err .verb, .step.err .step-row > svg.i { color: var(--bad); }
.step.stopped .verb, .step.stopped .step-row > svg.i { color: var(--muted); }
.step.running .verb { background: linear-gradient(90deg, var(--muted) 0%, var(--text) 50%, var(--muted) 100%); background-size: 200% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: shimmer 1.4s linear infinite; }
@keyframes shimmer { to { background-position: -200% 0; } }
.spin { width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid var(--line-strong); border-top-color: var(--text); animation: rot .8s linear infinite; flex: none; }
@keyframes rot { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) {
  .step.running .verb { animation: none; color: var(--muted); background: none; }
  .spin, .status.run::before { animation: none; }
  .caret { animation: none; }
  .skel { animation: none !important; }
  * { transition: none !important; }
}
.step-detail { margin: 4px 0 8px 17px; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r-md); background: var(--surface-2); display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.params { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 3px 14px; font-size: var(--text-sm); margin: 0; }
.params dt { color: var(--muted); font-family: var(--font-mono); font-size: 12px; padding-top: 1px; }
.params dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.hits { display: flex; flex-direction: column; gap: 8px; }
.hit { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 2px 8px; align-items: start; }
.fav { width: 18px; height: 18px; border-radius: 4px; background: var(--select); color: var(--text-2); display: grid; place-items: center; font-size: 10px; font-weight: 600; text-transform: uppercase; margin-top: 2px; }
.hit a { color: var(--text); text-decoration: none; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hit a:hover { text-decoration: underline; }
.hit small { grid-column: 2; color: var(--muted); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.link-btn { justify-self: start; background: none; border: 0; padding: 0; min-height: 24px; color: var(--muted); font-size: var(--text-xs); text-decoration: underline; text-underline-offset: 2px; align-self: flex-start; }
.link-btn:hover { color: var(--text); }
pre.raw { margin: 0; padding: 8px 10px; border-radius: var(--r-sm); background: var(--surface); border: 1px solid var(--line); overflow: auto; max-height: 260px; white-space: pre-wrap; word-break: break-word; }
.sources { display: flex; flex-wrap: wrap; gap: 6px; }
.source { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: var(--r-full); padding: 2px 10px 2px 3px; font-size: 12.5px; color: var(--text-2); text-decoration: none; background: var(--surface); max-width: 100%; min-height: 26px; }
.source span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.source:hover { background: var(--surface-hover); color: var(--text); }
.source .fav { width: 18px; height: 18px; margin: 0; border-radius: 50%; font-size: 9px; }

/* Notices and inline errors */
.notice { display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--line-strong); border-radius: var(--r-lg); padding: 10px 12px; background: var(--surface-2); font-size: var(--text-sm); color: var(--text-2); }
.notice > svg.i { margin-top: 2px; color: var(--muted); }
.notice.warn > svg.i { color: var(--warn); }
.notice .grow { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.notice b { color: var(--text); font-weight: 500; }
.notice .acts { display: flex; gap: 6px; flex-wrap: wrap; }
.inline-err { display: flex; gap: 10px; align-items: flex-start; border-left: 2px solid var(--bad); padding: 4px 0 4px 12px; font-size: var(--text-sm); }
.inline-err > svg.i { color: var(--bad); margin-top: 2px; }
.inline-err .grow { display: flex; flex-direction: column; gap: 6px; }
.inline-err b { font-weight: 500; }
.retrying { display: flex; gap: 10px; align-items: center; justify-content: flex-end; flex-wrap: wrap; font-size: var(--text-sm); color: var(--muted); margin-top: -12px; }

/* Composer */
.composer { flex: none; padding: 8px 24px 14px; }
.composer-inner { max-width: var(--chat-w); margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }
.composer form { border: 1px solid var(--control); border-radius: 14px; background: var(--surface); padding: 8px 8px 8px 14px; display: flex; gap: 8px; align-items: flex-end; }
.composer form:focus-within { outline: 2px solid var(--focus); outline-offset: 1px; }
.composer textarea { flex: 1; min-width: 0; resize: none; border: 0; background: transparent; padding: 5px 0; min-height: 22px; max-height: calc(8 * 1.55em); outline: none; line-height: var(--leading); }
.composer textarea::placeholder { color: var(--muted); }
.composer.disabled form { background: var(--surface-2); }
.send { width: 32px; height: 32px; border-radius: 9px; border: 0; background: var(--primary); color: var(--on-primary); display: grid; place-items: center; flex: none; }
.send:disabled { opacity: .35; cursor: not-allowed; }
.send.stop { background: var(--select); color: var(--text); }
.hint { color: var(--muted); font-size: var(--text-xs); text-align: center; }
.hint.reason { color: var(--text-2); }

/* New chat empty state */
.empty { margin: auto; max-width: 460px; text-align: center; display: flex; flex-direction: column; gap: 10px; align-items: center; padding: 24px 16px; }
.empty .ico { width: 40px; height: 40px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); display: grid; place-items: center; color: var(--muted); }
.empty p { color: var(--muted); }
.agent-card { border: 1px solid var(--line); border-radius: var(--r-lg); padding: 14px 16px; text-align: left; display: flex; flex-direction: column; gap: 8px; width: 100%; background: var(--surface); }
.agent-card .top { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }

/* A2UI surface */
.surface { border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--surface); padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.surface-tag { display: flex; justify-content: space-between; gap: 8px; align-items: center; flex-wrap: wrap; }
.surface .srow { display: flex; gap: 10px; flex-wrap: wrap; }
.surface label { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; color: var(--muted); flex: 1; min-width: 140px; }
.chip-pick { display: flex; flex-wrap: wrap; gap: 6px; }
.chip-pick button { border: 1px solid var(--control); background: var(--surface); border-radius: var(--r-full); padding: 2px 12px; min-height: 28px; font-size: 12.5px; color: var(--text-2); }
.chip-pick button[aria-pressed="true"] { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
.surface.sent, .surface.unused { background: var(--surface-2); }

/* Pages (admin) */
.page { flex: 1; min-height: 0; overflow: auto; }
.page-inner { padding: 24px; max-width: var(--detail-w); display: flex; flex-direction: column; gap: 20px; }
.page-inner.wide { max-width: 1100px; }
.page-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
.page-head p { margin-top: 4px; color: var(--muted); max-width: 62ch; }
.section { display: flex; flex-direction: column; gap: 10px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); }
.api { color: var(--muted); font-family: var(--font-mono); font-size: 12px; overflow-wrap: anywhere; }
.kv { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 8px 14px; font-size: var(--text-sm); margin: 0; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; min-width: 0; }
details.sys summary { cursor: pointer; color: var(--text-2); font-size: var(--text-sm); }
details.sys pre { white-space: pre-wrap; background: var(--surface-2); border: 1px solid var(--line); padding: 10px 12px; border-radius: var(--r-md); margin: 8px 0 0; }
.copy-line { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.copy-line code { background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 4px 8px; min-width: 0; overflow-x: auto; white-space: nowrap; max-width: 100%; flex: 1; }
.tools details { border-top: 1px solid var(--line); }
.tools details:first-child { border-top: 0; }
.tools summary { padding: 10px 14px; cursor: pointer; display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; list-style: none; }
.tools summary .chev { align-self: center; }
.tools details[open] > summary .chev { transform: rotate(90deg); }
.tools summary::-webkit-details-marker { display: none; }
.tools summary b { font-family: var(--font-mono); font-weight: 500; font-size: 13px; }
.tools summary span { color: var(--muted); min-width: 0; font-size: var(--text-sm); }
.fields { padding: 0 14px 14px 14px; display: grid; gap: 6px; }
.field-row { display: grid; grid-template-columns: minmax(120px, 190px) 80px minmax(0, 1fr); gap: 10px; font-size: var(--text-sm); }
.field-row .ty { color: var(--muted); font-family: var(--font-mono); font-size: 12px; }
.req { color: var(--muted); font-size: 12px; margin-left: 6px; font-family: var(--font-ui); }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: var(--text-sm); }
th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 500; white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
td .fix { color: var(--muted); font-size: var(--text-xs); margin-top: 2px; }
.seg-tabs { display: flex; gap: 2px; background: var(--hover); border-radius: var(--r-md); padding: 2px; }
.seg-tabs button { flex: 1; border: 0; background: none; border-radius: var(--r-sm); padding: 3px 8px; font-size: var(--text-xs); color: var(--muted); min-height: 26px; }
.seg-tabs button[aria-selected="true"] { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.08); }

/* Skeletons */
.skel { background: linear-gradient(90deg, var(--hover) 0%, var(--select) 50%, var(--hover) 100%); background-size: 200% 100%; animation: shimmer 1.4s linear infinite; border-radius: var(--r-sm); }
.content .skel { background: linear-gradient(90deg, var(--surface-2) 0%, var(--select) 50%, var(--surface-2) 100%); background-size: 200% 100%; }
.skel-row { display: flex; flex-direction: column; gap: 6px; padding: 9px 8px; }

/* Layers: popovers, sheets, dialogs, toast */
.scrim { position: absolute; inset: 0; background: rgba(0,0,0,.32); z-index: 25; }
.pop { position: absolute; z-index: 40; background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--r-lg); box-shadow: var(--shadow); min-width: 220px; max-width: min(360px, calc(100% - 16px)); padding: 6px; display: flex; flex-direction: column; gap: 2px; }
.pop.sheet { left: 0 !important; right: 0; bottom: 0; top: auto !important; max-width: none; border-radius: 16px 16px 0 0; padding: 8px 8px calc(12px + env(safe-area-inset-bottom, 0px)); max-height: 80%; overflow: auto; }
.pop.sheet::before { content: ""; width: 36px; height: 4px; border-radius: 2px; background: var(--line-strong); align-self: center; margin: 2px 0 8px; }
.pop .item { display: flex; gap: 10px; align-items: center; width: 100%; border: 0; background: none; border-radius: var(--r-md); padding: 7px 10px; text-align: left; color: var(--text); font-size: var(--text-sm); min-height: 34px; }
.pop .item:hover, .pop .item:focus-visible { background: var(--surface-hover); }
.pop .item.danger { color: var(--bad); }
.pop .item[aria-disabled="true"] { color: var(--muted); cursor: default; }
.pop .item[aria-checked="true"]::after { content: "✓"; margin-left: auto; color: var(--text); }
.pop .sep { height: 1px; background: var(--line); margin: 4px 2px; }
.pop .hdr { padding: 6px 10px 4px; }
.pick-opt { flex-direction: column; align-items: stretch !important; gap: 2px !important; }
.pick-opt .l1 { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.pick-opt .l1 b { font-family: var(--font-mono); font-weight: 500; font-size: 13px; }
.pick-opt small { color: var(--muted); font-size: var(--text-xs); }
.pick-opt[aria-selected="true"] { background: var(--select) !important; }
.pick-opt.hi { box-shadow: inset 0 0 0 2px var(--focus); cursor: pointer; }
.pick-opt { cursor: pointer; }
.pop .search { margin: 2px 2px 6px; }
.dialog { position: absolute; z-index: 45; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(460px, calc(100% - 32px)); max-height: calc(100% - 32px); overflow: auto; background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--r-lg); box-shadow: var(--shadow); padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.dialog .acts { display: flex; justify-content: flex-end; gap: 8px; }
.dialog a { color: var(--text); }
.keys { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 8px 16px; font-size: var(--text-sm); margin: 0; align-items: center; }
.keys dt { display: flex; gap: 4px; flex-wrap: wrap; }
.keys dd { margin: 0; color: var(--text-2); }
.toast { position: absolute; z-index: 60; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--primary); color: var(--on-primary); padding: 8px 10px 8px 14px; border-radius: var(--r-md); font-size: var(--text-sm); display: flex; gap: 12px; align-items: center; box-shadow: var(--shadow); max-width: calc(100% - 32px); }
.toast button { background: none; border: 0; color: inherit; text-decoration: underline; padding: 2px 4px; font-weight: 500; }

/* Connections */
td.conn-acts { white-space: nowrap; }
.conn-acts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; align-items: center; }
.conn-err { display: flex; gap: 6px; align-items: flex-start; color: var(--bad); font-size: var(--text-sm); margin: 4px 0 0; }
.conn-err svg.i { flex: none; margin-top: 2px; }
.switch-line { display: flex; gap: 6px; align-items: center; font-size: var(--text-xs); color: var(--text-2); margin-top: 6px; }
.conn-form { display: flex; flex-direction: column; gap: 8px; }
.conn-form label { font-weight: 500; font-size: var(--text-sm); }
.pw { display: flex; gap: 6px; }
.pw input { flex: 1; min-width: 0; font-family: var(--font-mono); }
.step.conn .verb, .step.conn .step-row > svg.i { color: var(--warn); }
.conn-card { display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--line-strong); border-radius: var(--r-lg); padding: 10px 12px; background: var(--surface-2); font-size: var(--text-sm); text-align: left; }
.conn-card.warn { border-left: 2px solid var(--warn); }
.conn-card > svg.i, .conn-card > .spin { flex: none; margin-top: 2px; color: var(--muted); }
.conn-card.warn > svg.i { color: var(--warn); }
.conn-card.ok > svg.i { color: var(--ok); }
.conn-card .grow { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.conn-card b { font-weight: 500; }
.conn-card .acts { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 2px; }
.fake-win { position: absolute; z-index: 50; right: 24px; top: 24px; width: min(360px, calc(100% - 32px)); background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--r-lg); box-shadow: var(--shadow); overflow: hidden; }
.fake-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 4px 6px 4px 12px; background: var(--surface-2); border-bottom: 1px solid var(--line); font-size: var(--text-xs); color: var(--muted); }
.fake-bar span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fake-body { padding: 16px; display: flex; flex-direction: column; gap: 10px; font-size: var(--text-sm); }
.fake-body h2 { font-size: 16px; margin: 0; }
.fake-body .acts { display: flex; justify-content: flex-end; gap: 8px; }
.fake-body .later-tag { align-self: flex-start; white-space: normal; }

/* Sign in */
.signin { position: absolute; inset: 0; z-index: 55; background: var(--bg); display: grid; place-items: center; padding: 16px; overflow: auto; }
.signin form { width: 100%; max-width: 360px; display: flex; flex-direction: column; gap: 14px; padding: 28px; }
.signin .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; }
.signin .brand .brand-mark { margin: 0; }
.signin label { display: flex; flex-direction: column; gap: 5px; font-weight: 500; font-size: var(--text-sm); }
.signin .err { color: var(--bad); font-size: var(--text-sm); display: flex; gap: 6px; align-items: center; }
.signin .info { font-size: var(--text-sm); color: var(--text-2); background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-md); padding: 8px 10px; }

/* ---------- Part 2 (T087): policy, interrupts, tasks, builder, skills, MCP servers ---------- */
.risk { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--text-2); white-space: nowrap; }
.risk::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--muted); flex: none; }
.risk.medium::before { background: var(--warn); }
.risk.high::before { background: var(--bad); }
.ptag { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: var(--text-2); border: 1px solid var(--line-strong); border-radius: var(--r-full); padding: 0 7px; white-space: nowrap; flex: none; line-height: 18px; }
.ptag svg.i { width: 12px; height: 12px; }
.ptag.warn { color: var(--warn); border-color: var(--warn); }
.step.denied .verb, .step.denied .step-row > svg.i { color: var(--text-2); }
.step.held .verb, .step.held .step-row > svg.i, .step.asked .verb, .step.asked .step-row > svg.i { color: var(--warn); }
.step-row .by { color: var(--muted); font-size: var(--text-xs); white-space: nowrap; }
.icard { display: flex; flex-direction: column; gap: 10px; border: 1px solid var(--line-strong); border-left: 2px solid var(--warn); border-radius: var(--r-lg); padding: 12px 14px; background: var(--surface); font-size: var(--text-sm); min-width: 0; }
.icard.done { border-left-color: var(--line-strong); background: var(--surface-2); }
.icard .ihead { display: flex; gap: 8px; align-items: flex-start; }
.icard .ihead > svg.i { color: var(--warn); margin-top: 2px; }
.icard.done .ihead > svg.i { color: var(--muted); }
.icard .ihead .grow { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.icard b { font-weight: 500; }
.icard .ibadges { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.icard .acts { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.icard pre.raw { max-height: 200px; }
textarea.field { width: 100%; resize: vertical; line-height: var(--leading); font-family: inherit; }
textarea.field.mono { font-family: var(--font-mono); font-size: 12.5px; }
.why { font-size: var(--text-xs); color: var(--muted); }
.view.task .page { flex: 1; }
.steer-tag { display: block; margin-bottom: 4px; }
.outputs { display: flex; flex-direction: column; gap: 10px; padding: 12px 14px; }
/* Full-width editors: the builder, versions, the skill editor */
.bhead { flex: none; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-height: 52px; padding: 8px 16px; border-bottom: 1px solid var(--line); }
.bhead .title { flex: 1; min-width: 120px; font-size: var(--text-md); font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bhead .title:focus { outline: none; }
.full { position: relative; flex: 1; min-height: 0; display: grid; grid-template-columns: 172px minmax(0, 1fr) 380px; }
.full.no-test { grid-template-columns: 172px minmax(0, 1fr); }
.bnav { border-right: 1px solid var(--line); padding: 16px 8px; overflow: auto; display: flex; flex-direction: column; gap: 2px; background: var(--surface); }
.bnav a { display: flex; align-items: center; justify-content: space-between; gap: 6px; border-radius: var(--r-md); padding: 5px 8px; min-height: 30px; color: var(--text-2); text-decoration: none; font-size: var(--text-sm); }
.bnav a:hover { background: var(--surface-hover); color: var(--text); }
.bnav a[aria-current="true"] { background: var(--select); color: var(--text); }
.bform { overflow: auto; min-height: 0; }
.bform-inner { padding: 20px 24px 48px; max-width: 780px; display: flex; flex-direction: column; gap: 28px; }
.fsec { display: flex; flex-direction: column; gap: 12px; scroll-margin-top: 12px; }
.fsec > h2 { font-size: var(--text-lg); }
.fsec > h2:focus { outline: none; }
.fsec > p.why { margin-top: -6px; }
.fld { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.fld > label, .fld > .flabel { font-weight: 500; font-size: var(--text-sm); }
.fld .help { font-size: var(--text-xs); color: var(--muted); }
.ferr { color: var(--bad); font-size: var(--text-sm); display: flex; gap: 6px; align-items: flex-start; margin: 0; }
.ferr svg.i { flex: none; margin-top: 2px; }
.fld input[type="text"], .fld input[type="number"], .fld input[type="url"], .fld select, .fld textarea { width: 100%; }
input[type="number"], input[type="url"] { background: var(--surface); border: 1px solid var(--control); border-radius: var(--r-md); padding: 5px 10px; font-size: var(--text-sm); min-height: 32px; }
[aria-invalid="true"] { border-color: var(--bad) !important; }
.frow { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.test { border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; background: var(--surface); }
.test-head { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
.test .thread { padding: 16px; }
.test .composer { padding: 8px 12px 12px; }
.radio-cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.rcard { position: relative; display: flex; flex-direction: column; gap: 4px; border: 1px solid var(--control); border-radius: var(--r-lg); padding: 10px 12px; background: var(--surface); cursor: pointer; font-size: var(--text-sm); }
.rcard input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.rcard:has(input:checked) { border-color: var(--focus); box-shadow: inset 0 0 0 1px var(--focus); }
.rcard:has(input:focus-visible) { outline: 2px solid var(--focus); outline-offset: 2px; }
.rcard:has(input:disabled) { cursor: not-allowed; background: var(--surface-2); }
.rcard b { font-weight: 600; display: flex; justify-content: space-between; gap: 6px; flex-wrap: wrap; }
.rcard span.d { font-size: 12.5px; color: var(--muted); }
.switch { width: 34px; height: 20px; border-radius: var(--r-full); border: 1px solid var(--control); background: var(--surface-2); position: relative; flex: none; padding: 0; }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--muted); transition: transform var(--fast) var(--ease); }
.switch[aria-checked="true"] { background: var(--primary); border-color: var(--primary); }
.switch[aria-checked="true"]::after { transform: translateX(14px); background: var(--on-primary); }
.switch:disabled { cursor: not-allowed; }
.switch-lab { display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--text-2); min-height: 24px; }
.tsblock { border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--surface); }
.tsblock > .tshead { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 14px; }
.tsblock > .tshead label.use { display: inline-flex; gap: 8px; align-items: center; font-weight: 500; }
.tsblock > .tshead .grow { flex: 1; }
.trow { display: grid; grid-template-columns: minmax(0, 1fr) auto auto auto; gap: 6px 14px; align-items: center; padding: 8px 14px; border-top: 1px solid var(--line); font-size: var(--text-sm); }
.trow .tn { min-width: 0; }
.trow .tn code { font-size: 12.5px; }
.trow .tn small { display: block; color: var(--muted); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.trow .cls { display: flex; gap: 8px; align-items: center; }
.trow select { min-height: 28px; padding: 2px 6px; font-size: 12.5px; }
.rules { display: flex; flex-direction: column; gap: 6px; }
.rule { display: grid; grid-template-columns: 110px minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; border: 1px solid var(--line); border-radius: var(--r-md); padding: 6px 8px 6px 10px; background: var(--surface); font-size: var(--text-sm); }
.rule.preset { background: var(--surface-2); }
.rule .rm { display: block; font-size: var(--text-xs); color: var(--muted); }
.rule-form { display: flex; flex-direction: column; gap: 10px; border: 1px solid var(--line-strong); border-radius: var(--r-lg); padding: 12px 14px; background: var(--surface-2); }
.checks-row { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: var(--text-sm); }
.checks-row label { display: inline-flex; gap: 6px; align-items: center; min-height: 24px; }
.preview { border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--surface-2); padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
.pcounts { display: flex; flex-wrap: wrap; gap: 6px 16px; }
.preview details summary { cursor: pointer; font-size: var(--text-sm); color: var(--text-2); }
.preview details ul { margin: 6px 0 0; padding-left: 18px; font-size: var(--text-sm); display: flex; flex-direction: column; gap: 2px; }
.notice.bad { border-left: 2px solid var(--bad); }
.notice.bad > svg.i { color: var(--bad); }
.notice ul { margin: 4px 0 0; padding-left: 18px; }
.notice a { color: var(--text); }
.dot-err { width: 7px; height: 7px; border-radius: 50%; background: var(--bad); flex: none; }
/* Versions and diff */
.vgrid { flex: 1; min-height: 0; display: grid; grid-template-columns: 320px minmax(0, 1fr); }
.vlist { list-style: none; margin: 0; padding: 8px; overflow: auto; border-right: 1px solid var(--line); }
.vlist a { display: flex; flex-direction: column; gap: 2px; border-radius: var(--r-md); padding: 8px 10px; text-decoration: none; color: var(--text-2); font-size: var(--text-sm); }
.vlist a:hover { background: var(--surface-hover); }
.vlist a[aria-current="true"] { background: var(--select); color: var(--text); }
.vlist .l1 { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
.vlist small { color: var(--muted); font-size: var(--text-xs); }
.diff { border: 1px solid var(--line); border-radius: var(--r-md); background: var(--surface-2); font-family: var(--font-mono); font-size: 12.5px; overflow: auto; }
.diff .dl { display: grid; grid-template-columns: 22px minmax(0, 1fr); padding: 1px 10px 1px 0; white-space: pre-wrap; overflow-wrap: anywhere; border-left: 2px solid transparent; }
.diff .dl .g { text-align: center; color: var(--muted); user-select: none; }
.diff .dl.add { border-left-color: var(--ok); }
.diff .dl.add .g { color: var(--ok); font-weight: 600; }
.diff .dl.del { border-left-color: var(--bad); }
.diff .dl.del .g { color: var(--bad); font-weight: 600; }
.diff .dl.ctx { color: var(--muted); }
.diff .dh { padding: 4px 10px; color: var(--muted); border-bottom: 1px solid var(--line); font-family: var(--font-ui); font-size: 12px; }
/* Skill editor */
.sk { flex: 1; min-height: 0; display: grid; grid-template-columns: 220px minmax(0, 1fr) minmax(0, 1fr); }
.tree { margin: 0; padding: 12px 8px; border-right: 1px solid var(--line); overflow: auto; display: flex; flex-direction: column; gap: 2px; }
.tree [role="treeitem"] { display: flex; align-items: center; gap: 6px; border: 0; background: none; border-radius: var(--r-md); padding: 4px 8px; min-height: 28px; text-align: left; color: var(--text-2); font-family: var(--font-mono); font-size: 12.5px; width: 100%; }
.tree [role="treeitem"]:hover { background: var(--surface-hover); }
.tree [role="treeitem"][aria-selected="true"] { background: var(--select); color: var(--text); }
.tree .indent { padding-left: 22px; }
.editor { display: flex; flex-direction: column; min-height: 0; overflow: auto; }
.editor .front { padding: 14px 16px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 12px; }
.editor textarea.body { flex: 1; min-height: 260px; font-family: var(--font-mono); font-size: 13px; border: 0; padding: 14px 16px; resize: none; background: var(--surface); outline: none; line-height: 1.6; color: var(--text); }
.editor textarea.body:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }
.pane-prev { border-left: 1px solid var(--line); overflow: auto; padding: 16px 20px; min-width: 0; }
.chip-input { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; border: 1px solid var(--control); border-radius: var(--r-md); padding: 4px 6px; background: var(--surface); }
.chip-input input { border: 0; outline: none; min-height: 24px; flex: 1; min-width: 120px; background: transparent; font-family: var(--font-mono); font-size: 12.5px; padding: 0 4px; }
.chip-input:focus-within { outline: 2px solid var(--focus); outline-offset: 1px; }
.chip-x { display: inline-flex; align-items: center; gap: 2px; }
.chip-x button { border: 0; background: none; padding: 0 2px; min-width: 24px; min-height: 24px; color: var(--muted); display: inline-grid; place-items: center; }
.matches { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; font-size: var(--text-sm); }
.matches li { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.drop { border: 1.5px dashed var(--control); border-radius: var(--r-lg); padding: 28px 16px; text-align: center; display: flex; flex-direction: column; gap: 10px; align-items: center; background: var(--surface-2); }
.checks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; font-size: var(--text-sm); }
.checks li { display: flex; gap: 8px; align-items: flex-start; }
.checks li svg.i { margin-top: 2px; }
.checks li.ok svg.i { color: var(--ok); }
.checks li.bad svg.i { color: var(--bad); }
/* Wizard (add an MCP server) */
.wsteps { list-style: none; margin: 0; padding: 0; display: flex; gap: 6px 18px; flex-wrap: wrap; font-size: var(--text-sm); color: var(--muted); }
.wsteps li { display: inline-flex; align-items: center; gap: 6px; }
.wsteps li[aria-current="step"] { color: var(--text); font-weight: 500; }
.wsteps .n { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; border: 1px solid var(--line-strong); font-size: 12px; }
.wsteps li.done .n { background: var(--select); }
.wsteps li[aria-current="step"] .n { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
.tcard { border: 1px solid var(--line); border-radius: var(--r-lg); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; background: var(--surface); font-size: var(--text-sm); min-width: 0; }
.tcard .top { display: flex; gap: 8px; justify-content: space-between; align-items: center; flex-wrap: wrap; }
.tcard .cls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.tcard .cls select { min-height: 28px; padding: 2px 6px; font-size: 12.5px; }
.rawdesc { white-space: pre-wrap; background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 6px 8px; font-family: var(--font-mono); font-size: 12px; margin: 0; overflow-wrap: anywhere; }
.trig-firings { margin: 6px 0 0; padding: 0; list-style: none; font-size: var(--text-xs); color: var(--text-2); display: flex; flex-direction: column; gap: 2px; }

/* Laptop */
@container app (max-width: 1199px) {
  .app { grid-template-columns: var(--rail-w) var(--list-w-laptop) minmax(0, 1fr); }
  .app.no-list { grid-template-columns: var(--rail-w) minmax(0, 1fr); }
  .thread { padding-inline: 20px; }
  .full, .full.no-test { grid-template-columns: minmax(0, 1fr); }
  .bnav { display: none; }
  .test { position: absolute; z-index: 20; top: 0; right: 0; bottom: 0; width: min(380px, 92%); box-shadow: var(--shadow); }
  .sk { grid-template-columns: 200px minmax(0, 1fr); }
  .sk .pane-prev { display: none; }
  .sk.preview .editor { display: none; }
  .sk.preview .pane-prev { display: block; border-left: 0; }
  .vgrid { grid-template-columns: 260px minmax(0, 1fr); }
}
/* Phone */
@container app (max-width: 767px) {
  .app, .app.no-list { grid-template-columns: minmax(0, 1fr); }
  .rail { display: none; }
  .app.no-list .list { display: flex; }
  .list { position: absolute; z-index: 30; top: 0; bottom: 0; left: 0; width: min(320px, 86%); transform: translateX(-102%); transition: transform var(--slow) var(--ease); border-right: 1px solid var(--line-strong); }
  .app.drawer .list { transform: none; box-shadow: var(--shadow); }
  .sections-tabs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 2px; padding-bottom: 2px; }
  .sections-tabs a { border-radius: var(--r-md); padding: 6px 4px; min-height: 44px; font-size: var(--text-xs); color: var(--muted); text-decoration: none; display: flex; flex-direction: column; gap: 2px; align-items: center; justify-content: center; text-align: center; }
  .sections-tabs a[aria-current="page"] { background: var(--select); color: var(--text); }
  .sections-tabs .tag { padding: 0 4px; }
  .head.wrap { flex-wrap: wrap; row-gap: 4px; }
  .head.wrap .head-break { display: block; flex-basis: 100%; height: 0; }
  .head.wrap .title { flex-basis: 0; }
  .copy-line code { white-space: pre-wrap; word-break: break-all; }
  .list-foot { display: flex; align-items: center; gap: 10px; padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); }
  .row { min-height: 44px; }
  .row-wrap .more { opacity: 1; }
  .only-phone { display: inline-grid !important; }
  .not-phone { display: none !important; }
  .head { padding-inline: 8px; }
  .thread { padding: 20px 16px 8px; }
  .composer { padding: 6px 16px calc(12px + env(safe-area-inset-bottom, 0px)); }
  .msg-user { max-width: 90%; }
  .page-inner { padding: 16px; }
  .field-row { grid-template-columns: minmax(0, 1fr); gap: 0; }
  .kv { grid-template-columns: minmax(0, 1fr); gap: 0; }
  .kv dd { margin-bottom: 8px; }
  .agent-btn { max-width: 60%; }
  .hint.keys-hint { display: none; }
  .tbl-cards thead { display: none; }
  .tbl-cards tr { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
  .tbl-cards tr:last-child { border-bottom: 0; }
  .tbl-cards td { padding: 0; border: 0; }
  .tbl-cards td[data-wide] { grid-column: 1 / -1; }
  .tbl-cards td[data-label]::before { content: attr(data-label) ": "; color: var(--muted); }
  .tbl-cards .conn-acts { justify-content: flex-start; }
  .tbl-cards td.org-cell { border-top: 1px dashed var(--line); padding-top: 8px; margin-top: 4px; }
  .tbl-cards td.org-cell::before { content: "Org (admins)"; display: block; color: var(--muted); font-size: var(--text-xs); margin-bottom: 2px; }
  .fake-win { inset: 0; width: auto; border-radius: 0; border: 0; }
  .radio-cards, .frow { grid-template-columns: minmax(0, 1fr); }
  .trow { grid-template-columns: minmax(0, 1fr) auto; }
  .trow .cls { grid-column: 1 / -1; flex-wrap: wrap; }
  .rule { grid-template-columns: minmax(0, 1fr) auto; }
  .rule > :nth-child(2) { grid-column: 1 / -1; grid-row: 2; }
  .vgrid { grid-template-columns: minmax(0, 1fr); }
  .vlist { border-right: 0; border-bottom: 1px solid var(--line); max-height: 40%; }
  .bhead { padding-inline: 8px; }
}
</style>
</head>

/* ============ Keyboard ============ */
// The platform's modifier only (⌘ or Ctrl, never both, never Alt); no key repeat; letters by e.code so layouts agree.
document.addEventListener("keydown", e => {
  if (e.target.closest && e.target.closest(".devbar")) return;
  if (e.repeat || e.isComposing) return;
  const modal = !!S.signin || (layer && layer.nodes.some(n => n.classList.contains("dialog")));
  if (e.key === "Escape") {
    if (S.signin) return; // nothing to close behind the sign-in card
    if (closeLayers()) { e.preventDefault(); return; }
    if (S.connWait) { e.preventDefault(); endOAuth(connOf(S.connWait.ts), "closed"); return; }
    if (S.drawer) { e.preventDefault(); S.drawer = false; render(); return; }
    if (S.page === "builder" && S.bld && S.bld.test && S.mode !== "desktop") { e.preventDefault(); S.bld.test = false; render(); return; } // the laptop test overlay
    if (runHere()) { e.preventDefault(); stopRun(); return; }
    return;
  }
  if (modal) return; // a dialog takes only Esc and its own keys
  const mod = MAC ? e.metaKey && !e.ctrlKey : e.ctrlKey && !e.metaKey;
  if (e.altKey) return;
  const inField = e.target.closest && e.target.closest("input, textarea, select, [contenteditable]");
  if (mod && e.shiftKey && e.code === "KeyO") { e.preventDefault(); newChat(); return; }
  if (mod && !e.shiftKey && e.code === "KeyK") { e.preventDefault(); closeLayers(false); focusSearch(); return; }
  if (mod && e.shiftKey && e.code === "KeyS") { e.preventDefault(); toggleList(); return; }
  if (mod && !e.shiftKey && e.code === "KeyS" && (S.page === "builder" || S.page === "skill-edit")) { e.preventDefault(); if (S.page === "builder") saveDraft(); else saveSkill(); return; }
  if (mod && e.code === "Slash") { e.preventDefault(); showShortcuts(); return; }
  if (inField || e.metaKey || e.ctrlKey || !S.singleKeys) return;
  if (e.key === "?" || (e.code === "Slash" && e.shiftKey)) { e.preventDefault(); showShortcuts(); return; }
  if (e.key === "/") { e.preventDefault(); focusComposer(); }
});

/* ============ Mockup controls ============ */
function setTheme(v) {
  if (v) document.documentElement.setAttribute("data-theme", v); else document.documentElement.removeAttribute("data-theme");
  document.querySelectorAll("#dv-theme button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.v === v)));
  try { localStorage.setItem("ak-mock-theme", v); } catch (e) { /* storage blocked: the default theme is fine */ }
}
function seg(id, fn) { document.querySelectorAll("#" + id + " button").forEach(b => b.addEventListener("click", () => { document.querySelectorAll("#" + id + " button").forEach(x => x.setAttribute("aria-pressed", String(x === b))); fn(b.dataset.v); })); }
seg("dv-theme", setTheme);
seg("dv-role", v => { S.role = v; if (!isAdmin() && ADMIN_SECTIONS.includes(S.section)) { S.section = "chats"; S.page = null; } if (!isAdmin() && S.taskTab === "triggers") S.taskTab = "tasks"; render(); });
seg("dv-width", v => {
  const st = $("#stage"), fr = $("#frame");
  if (v === "fit") { st.classList.remove("framed"); fr.style.width = ""; fr.style.height = ""; }
  else { st.classList.add("framed"); fr.style.width = v + "px"; fr.style.height = v === "400" ? "820px" : "760px"; }
  S.drawer = false;
});
$("#dv-later").addEventListener("change", e => { S.later = e.target.checked; render(); });
$("#dv-state").addEventListener("change", e => applyState(e.target.value));

function applyState(st) {
  if (S.run) { clearInterval(S.run.timer); S.run = null; }
  stopRetry();
  S.mine = MINE0(); S.org = ORG0(); S.connWait = null; S.connErr = null;
  S.state = st; S.signin = null; S.drawer = false; S.threads = {}; S.deleted.clear(); S.search = ""; S.filterAgent = ""; S.drafts = {}; S.pending = null; S.busyChecks = 0;
  CONVS_ALL.forEach(c => { delete c.resumed; delete c.unread; c.waiting = c.id === "conv_ask01x" || c.id === "conv_appr01"; });
  // Part 2: the sample data, the full pages and the running tasks start over too.
  stopSim(); resetData(); VERSIONS = VERSIONS0();
  S.page = null; S.bld = null; S.ver = null; S.sk = null; S.mcp = null; S.upload = null; S.review = null; S.taskThreads = {};
  S.taskTab = "tasks"; S.taskSel = "run_8d2kq1"; S.threadSel = THREADS[0].id; S.taskFilter = "all";
  const task = (id, tab) => { S.state = "normal"; S.section = "tasks"; S.taskTab = tab || "tasks"; if (id) S.taskSel = id; };
  const mcp = patch => { S.section = "toolsets"; S.page = "mcp-add"; S.mcp = Object.assign(newMcp(), patch); };
  const si = (card, err, extra) => { S.state = "normal"; S.signin = { card, reason: null, err, both: false, ...extra }; };
  const go = (section, conv) => { S.section = section; if (conv !== undefined) S.conv = conv; };
  switch (st) {
    case "normal": go("chats", "conv_7f3k2q"); break;
    case "streaming": go("chats", "conv_7f3k2q"); render(); startRun("And what changed in the runtime?"); return;
    case "long": go("chats", "conv_long01"); S.scrollTop = "top"; break;
    case "signin": si("password", null); break;
    case "signin-error": si("password", "wrong"); break;
    case "signin-throttled": si("password", "throttled"); break;
    case "signin-unreachable": si("password", "unreachable"); break;
    case "signin-both": si("password", null, { both: true }); break;
    case "token": si("token", null); break;
    case "token-error": si("token", "token"); break;
    case "401": go("chats", "conv_7f3k2q"); S.drafts.conv_7f3k2q = "Can you also check the 1.26.1 patch notes?"; si("password", null, { reason: "401" }); break;
    case "empty": go("chats", null); break;
    case "no-agents": go("chats", null); break;
    case "load-failed": go("chats", "conv_7f3k2q"); break;
    case "agent-removed": S.state = "normal"; go("chats", "conv_s0rm1x"); break;
    case "loading": if (S.section === "chats" && !S.conv) S.conv = "conv_7f3k2q"; break;
    case "403": S.role = "user"; document.querySelectorAll("#dv-role button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.v === "user"))); go("agents"); break;
    case "404": go("chats", "conv_9zz0q1"); break;
    case "busy": go("chats", "conv_q81mzc"); break;
    case "interrupted": go("chats", "conv_k4p9xe"); break;
    case "503": case "503-restart": case "err-rate": case "err-refused": case "err-context": case "lost": case "tool-failed": go("chats", "conv_7f3k2q"); break;
    case "too-large": go("chats", "conv_7f3k2q"); S.drafts.conv_7f3k2q = "Here is the full log:\n2026-10-12T09:14:03Z INFO server starting…\n(about 3 MB more pasted)"; break;
    case "offline": go("chats", "conv_7f3k2q"); break;
    case "conn-page": S.state = "normal"; go("connections"); break;
    case "conn-chat": S.state = "normal"; go("chats", "conv_q81mzc"); break;
    case "conn-rejected": S.state = "normal"; go("connections"); render(); keyDialog(connOf("exa"), "me", $("#conn-act-exa"), true); return;
    case "conn-waiting": S.state = "normal"; go("connections"); startOAuth(connOf("github"), "me"); return;
    case "conn-denied": S.state = "normal"; go("connections"); S.connErr = { ts: "github", text: "You didn't allow access. Nothing was saved." }; break;
    case "conn-expired": S.state = "normal"; go("connections"); S.connErr = { ts: "github", text: "Connecting took too long or failed. Try again." }; break;
    // Interrupts and policy in a chat (T083, T084, T085)
    case "chat-question": S.state = "normal"; go("chats", "conv_ask01x"); break;
    case "chat-approval": S.state = "normal"; go("chats", "conv_appr01"); break;
    case "chat-policy": S.state = "normal"; go("chats", "conv_pol01x"); break;
    case "answered-elsewhere": go("chats", "conv_appr01"); break;
    // Tasks (T071, T086), threads (T073), triggers (T072)
    case "tasks": task("run_8d2kq1"); break;
    case "task-waiting": task("run_5x0p7a"); break;
    case "task-paused": task("run_3h7wqa"); break;
    case "task-done": task("run_1q9wze"); break;
    case "task-failed": task("run_0m3tty"); break;
    case "task-new": task("run_8d2kq1"); render(); newTaskDialog($("#task-pause"), { agent: "researcher" }); return;
    case "task-limit": task("run_8d2kq1"); S.state = "task-limit"; render(); newTaskDialog($("#task-pause"), { agent: "researcher", input: "Compare the three managed vector databases on price at 2 million vectors." }); return;
    case "notify": case "notify-waiting": {
      S.state = "normal"; go("chats", "conv_7f3k2q"); render();
      // A notification never takes the answer itself: Review opens the task at the waiting card.
      if (st === "notify") toast("Task done: Summarize yesterday's incidents", ["Open", () => openTask("run_1q9wze")]);
      else toast("ops-helper is waiting for you: Check every toolset after deploy", ["Review", () => { openTask("run_5x0p7a"); const f = $(".icard:not(.done) button"); if (f) { f.scrollIntoView({ block: "center" }); f.focus(); } }]);
      $("#dv-state").value = "normal";
      return;
    }
    case "threads": task(null, "threads"); S.threadSel = "thr_2zz8qp"; break;
    case "triggers": task(null, "triggers"); break;
    // The agent builder and versions (T075)
    case "builder": S.state = "normal"; openBuilder("researcher", true); S.bld.test = S.mode === "desktop"; break;
    case "builder-errors":
      openBuilder("researcher", true); S.bld.d.model = "claude-opus-9"; S.bld.d.policy.rules.unshift({ name: "no_removes", m: { kinds: ["remove"] }, a: "deny" });
      saveDraft(); return;
    case "builder-conflict": openBuilder("researcher", true); S.bld.d.maxTurns = 14; S.bld.d.desc = "Answers questions with web search and cites its sources, newest first."; saveDraft(); return;
    case "builder-config": S.state = "normal"; openBuilder("default", true); break;
    case "versions": S.state = "normal"; openVersions("researcher", 4, true); break;
    // Skills (T076)
    case "skills": S.state = "normal"; S.section = "skills"; S.skillSel = "deploy-runbook"; break;
    case "skill-edit": S.state = "normal"; openSkillEditor("weekly-digest-format", true); break;
    case "skill-upload": S.state = "normal"; S.section = "skills"; S.page = "skill-upload"; S.upload = { step: "pick" }; break;
    case "skill-upload-bad": S.section = "skills"; S.page = "skill-upload"; S.upload = { step: "checked", bad: true }; break;
    // MCP servers added at run time (T096); per-user sign-in later (T095)
    case "mcp-add": S.state = "normal"; mcp({}); break;
    case "mcp-private": mcp({ url: "https://10.0.3.12:8443/mcp", name: "wiki", err: "10.0.3.12 is a private address. agentkit connects only to public addresses, so a server can't be used to reach your network. (url_not_allowed)" }); break;
    case "mcp-auth": S.state = "normal"; mcp({ url: "https://mcp.linear.app/mcp", name: "linear2", step: 2, challenge: true, auth: "headers" }); break;
    case "mcp-review": S.state = "normal"; mcp({ url: "https://mcp.linear.app/mcp", name: "linear2", step: 3, auth: "headers", tools: PROBED() }); break;
    case "mcp-review-needed": S.state = "normal"; S.section = "toolsets"; S.toolsetSel = "linear"; S.page = "mcp-review"; break;
    case "conn-mcp":
      S.state = "normal"; go("connections");
      CONNECTORS.push({ ts: "linear", prov: "Linear", kind: "account", mcp: true }); S.mine.linear = { st: "none" };
      TOOLSETS.find(t => t.name === "linear").status = "ready"; agentByName("ops-helper").toolsets.push("linear");
      break;
  }
  render();
}

/* Width mode from the frame's own width (the same breakpoints as the container queries). */
function measure() {
  const w = $("#frame").getBoundingClientRect().width;
  const m = w < 768 ? "phone" : w < 1200 ? "laptop" : "desktop";
  if (m !== S.mode) {
    S.mode = m; S.drawer = false;
    if (m !== "phone") defaultSelections();
    render();
  }
}
new ResizeObserver(measure).observe($("#frame"));

try { const t = localStorage.getItem("ak-mock-theme"); if (t) setTheme(t); } catch (e) { /* storage blocked */ }
applyRoute(); // a reload or a pasted link opens the same view
measure(); render();
</script>
