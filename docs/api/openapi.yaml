              "Location": {
                "description": "/v1/runs/{id}",
                "schema": {
                  "type": "string"
                }
              },
              "Agentkit-Run-Id": {
                "description": "The run's ID.",
                "schema": {
                  "type": "string"
                }
              },
              "Agentkit-Conversation-Id": {
                "description": "The ID of the task's conversation.",
                "schema": {
                  "type": "string"
                }
              }
