{
  "openapi": "3.1.0",
  "info": {
    "title": "agentkit agent API",
    "version": "1",
    "description": "The HTTP API of `agentkit serve` (package pkg/agentapi). Within version 1 the API only grows: new fields, event types and error codes; clients ignore what they do not know. Any route may also answer 500 internal on a server fault. This file is JSON, which is YAML too (tools that read YAML read it)."
  },
  "servers": [
    {
      "url": "http://127.0.0.1:8080"
    }
  ],
  "security": [
    {
      "bearer": []
    },
    {
      "session": []
    },
    {}
  ],
  "paths": {
    "/v1/runs": {
      "post": {
        "operationId": "createRun",
        "summary": "Run an agent on a message",
        "description": "Starts a conversation, continues one, or (with an empty message) resumes an interrupted one. A new message to an interrupted conversation cancels the interrupted run and starts a new one. The response is the run's event stream (text/event-stream), or with Accept: application/json the run once it ends. A client that goes away from a stream leaves the run going for a reconnect grace (10s), in which GET /v1/runs/{id}/events follows it again; after the grace the run is interrupted.",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/RunRequest"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "The run.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Run"
                }
              },
              "text/event-stream": {
                "schema": {
                  "type": "string",
                  "description": "Server-Sent Events: each event's name is its type and its data the JSON of an Event (components.schemas.Event)."
                }
              }
            }
          },
          "400": {
            "description": "invalid_request: the body is not a RunRequest, the message is empty for a new conversation, or no agent is named and the server has no default.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              }
            }
          },
          "401": {
            "description": "unauthorized: the server needs credentials (an API key, or its token) and the request's bearer token is missing or wrong.",
            "headers": {
              "WWW-Authenticate": {
                "description": "Bearer realm=\"agentkit\"",
                "schema": {
                  "type": "string"
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              }
            }
          },
          "403": {
            "description": "forbidden: the request's credential does not have the scope agent:run. Or csrf_failed: a session's request without the server's Origin or the CSRF token of GET /v1/auth/me in X-Agentkit-CSRF.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              }
            }
          },
          "404": {
            "description": "not_found: no such conversation, or no such agent.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              }
            }
          },
          "409": {
            "description": "conversation_busy: a run of the conversation is going on (run_id names it); agent_mismatch: the conversation belongs to another agent. A new message to an interrupted conversation replaces its run, so is not 409.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              }
            }
          },
          "413": {
            "description": "too_large: the body is over the server's limit.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              }
            }
          },
          "429": {
            "description": "over_capacity: the run's runner pool is running as many runs as its limit (retryable).",
            "headers": {
              "Retry-After": {
                "description": "Seconds to wait.",
                "schema": {
                  "type": "string"
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              }
            }
          },
          "503": {
            "description": "over_capacity: too many runs (retryable); shutting_down: the server is draining.",
            "headers": {
              "Retry-After": {
                "description": "Seconds to wait.",
                "schema": {
                  "type": "string"
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              }
            }
          }
        }
      },
      "get": {
        "operationId": "listRuns",
        "summary": "List runs",
        "description": "The tenant's runs, newest first, or a conversation's (conversation_id); status, background and agent filter them.",
        "parameters": [
          {
            "name": "conversation_id",
            "in": "query",
            "description": "Only the runs of this conversation.",
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "status",
            "in": "query",
            "description": "Only runs of this status.",
            "schema": {
              "$ref": "#/components/schemas/Run/properties/status"
            }
          },
          {
            "name": "background",
            "in": "query",
            "description": "true: only background runs (tasks, POST /v1/tasks); false: only chat runs.",
            "schema": {
              "type": "boolean"
            }
          },
          {
            "name": "agent",
            "in": "query",
            "description": "Only the runs of this agent's conversations.",
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "limit",
            "in": "query",
            "description": "Runs per page.",
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 100,
              "default": 20
            }
          },
          {
            "name": "cursor",
            "in": "query",
            "description": "The previous page's next_cursor.",
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "A page of runs.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/RunList"
                }
              }
            }
          },
          "400": {
            "description": "invalid_request: an unknown status, a background that is not true or false, an agent that is not a name, a bad limit or cursor.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              }
            }
          },
          "401": {
            "description": "unauthorized: the server needs credentials (an API key, or its token) and the request's bearer token is missing or wrong.",
            "headers": {
              "WWW-Authenticate": {
                "description": "Bearer realm=\"agentkit\"",
                "schema": {
                  "type": "string"
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              }
            }
          },
          "403": {
            "description": "forbidden: the request's credential does not have the scope agent:read.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              }
            }
          },
          "404": {
            "description": "not_found: no such conversation.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              }
            }
          }
        }
      }
    },
    "/v1/runs/{id}": {
      "get": {
        "operationId": "getRun",
        "summary": "Get a run",
        "parameters": [
          {
            "name": "id",
            "in": "path",
            "description": "The run's ID.",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "The run.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Run"
                }
              }
            }
          },
          "401": {
            "description": "unauthorized: the server needs credentials (an API key, or its token) and the request's bearer token is missing or wrong.",
            "headers": {
              "WWW-Authenticate": {
                "description": "Bearer realm=\"agentkit\"",
                "schema": {
                  "type": "string"
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              }
            }
          },
          "403": {
            "description": "forbidden: the request's credential does not have the scope agent:read.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              }
            }
          },
          "404": {
            "description": "not_found: no such run (or it was dropped by retention).",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              }
            }
          }
        }
      }
    },
    "/v1/runs/{id}/events": {
      "get": {
        "operationId": "runEvents",
        "summary": "Follow a run's events",
        "description": "The run's events from the one after Last-Event-ID (from the first without it), then, while this server runs it, the new ones as they come. A run that ended, or that another process runs, is replayed from the store as far as it is stored, and the stream ends there. Within the reconnect grace this is how a client comes back to a chat run.",
        "parameters": [
          {
            "name": "id",
            "in": "path",
            "description": "The run's ID.",
            "required": true,
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "Last-Event-ID",
            "in": "header",
            "description": "The id of the last event the client has. Any server sharing the run's store answers from the event after it.",
            "schema": {
              "type": "string",
              "pattern": "^(0|[1-9][0-9]*)(\\.[1-9][0-9]*)?$"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "The run's event stream.",
            "content": {
              "text/event-stream": {
                "schema": {
                  "type": "string",
                  "description": "Server-Sent Events: each event's name is its type, its id the event's id, and its data the JSON of an Event (components.schemas.Event)."
                }
              }
            }
          },
          "400": {
            "description": "invalid_request: Last-Event-ID is not an event's id.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              }
            }
          },
          "401": {
            "description": "unauthorized: the server needs credentials (an API key, or its token) and the request's bearer token is missing or wrong.",
            "headers": {
              "WWW-Authenticate": {
                "description": "Bearer realm=\"agentkit\"",
                "schema": {
                  "type": "string"
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              }
            }
          },
          "403": {
            "description": "forbidden: the request's credential does not have the scope agent:read.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              }
            }
          },
          "404": {
            "description": "not_found: no such run.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              }
            }
          }
        }
      }
    },
    "/v1/runs/{id}/resume": {
      "post": {
        "operationId": "resumeRun",
        "summary": "Resume a run",
        "description": "Continues a run that is interrupted, failed, or was left by a process that stopped. The response is the run's event stream from the first event of the continuation (its ids go on after the run's events so far), or with Accept: application/json the run once it ends.",
        "parameters": [
          {
            "name": "id",
            "in": "path",
            "description": "The run's ID.",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "The resumed run.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Run"
                }
              },
              "text/event-stream": {
                "schema": {
                  "type": "string",
                  "description": "Server-Sent Events: each event's name is its type, its id the event's id, and its data the JSON of an Event (components.schemas.Event)."
                }
              }
            }
          },
          "401": {
            "description": "unauthorized: the server needs credentials (an API key, or its token) and the request's bearer token is missing or wrong.",
            "headers": {
              "WWW-Authenticate": {
                "description": "Bearer realm=\"agentkit\"",
                "schema": {
                  "type": "string"
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              }
            }
          },
          "403": {
            "description": "forbidden: the request's credential does not have the scope agent:run. Or csrf_failed: a session's request without the server's Origin or the CSRF token of GET /v1/auth/me in X-Agentkit-CSRF.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              }
            }
          },
          "404": {
            "description": "not_found: no such run.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              }
            }
          },
          "409": {
            "description": "run_final: the run is done, canceled or rejected; awaiting_decision: it waits for a decision; run_leased: it is going on (retryable). run_id names the run.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              }
            }
          },
          "429": {
            "description": "over_capacity: the run's runner pool is running as many runs as its limit (retryable).",
            "headers": {
              "Retry-After": {
                "description": "Seconds to wait.",
                "schema": {
                  "type": "string"
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              }
            }
          },
          "503": {
            "description": "over_capacity: too many runs (retryable); shutting_down: the server is draining.",
            "headers": {
              "Retry-After": {
                "description": "Seconds to wait.",
                "schema": {
                  "type": "string"
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              }
            }
          }
        }
      }
    },
    "/v1/runs/{id}/stop": {
      "post": {
        "operationId": "stopRun",
        "summary": "Stop a run",
        "description": "Interrupts the run at once, keeping its completed turns: POST /v1/runs/{id}/resume continues it, and a new message to its conversation starts a new run. A run that is not going on is returned as it is.",
        "parameters": [
          {
            "name": "id",
            "in": "path",
            "description": "The run's ID.",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "The run, once this server's execution of it has ended.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Run"
                }
              }
            }
          },
          "401": {
            "description": "unauthorized: the server needs credentials (an API key, or its token) and the request's bearer token is missing or wrong.",
            "headers": {
              "WWW-Authenticate": {
                "description": "Bearer realm=\"agentkit\"",
                "schema": {
                  "type": "string"
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              }
            }
          },
          "403": {
            "description": "forbidden: the request's credential does not have the scope agent:run. Or csrf_failed: a session's request without the server's Origin or the CSRF token of GET /v1/auth/me in X-Agentkit-CSRF.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              }
            }
          },
          "404": {
            "description": "not_found: no such run.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              }
            }
          },
          "409": {
            "description": "run_leased: another process runs it; the command must reach that process (retryable).",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              }
            }
          }
        }
      }
    },
    "/v1/runs/{id}/cancel": {
      "post": {
        "operationId": "cancelRun",
        "summary": "Cancel a run",
        "description": "Ends the run for good (canceled). Canceling a canceled run is a no-op.",
        "parameters": [
          {
            "name": "id",
            "in": "path",
            "description": "The run's ID.",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "The run, once this server's execution of it has ended.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Run"
                }
              }
            }
          },
          "401": {
            "description": "unauthorized: the server needs credentials (an API key, or its token) and the request's bearer token is missing or wrong.",
            "headers": {
              "WWW-Authenticate": {
                "description": "Bearer realm=\"agentkit\"",
                "schema": {
                  "type": "string"
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              }
            }
          },
          "403": {
            "description": "forbidden: the request's credential does not have the scope agent:run. Or csrf_failed: a session's request without the server's Origin or the CSRF token of GET /v1/auth/me in X-Agentkit-CSRF.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              }
            }
          },
          "404": {
            "description": "not_found: no such run.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              }
            }
          },
          "409": {
            "description": "run_final: the run ended otherwise (done, failed or rejected are final too); run_leased: another process runs it (retryable).",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              }
            }
          }
        }
      }
    },
    "/v1/runs/{id}/decisions": {
      "post": {
        "operationId": "decideRun",
        "summary": "Decide a pending step",
        "description": "Approves or rejects the step a suspended flow run waits for. The run goes on in the background; the response is the run as it is then, or with Accept: text/event-stream its events from there on.",
        "parameters": [
          {
            "name": "id",
            "in": "path",
            "description": "The run's ID.",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/DecisionRequest"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "The run.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Run"
                }
              },
              "text/event-stream": {
                "schema": {
                  "type": "string",
                  "description": "Server-Sent Events: each event's name is its type, its id the event's id, and its data the JSON of an Event (components.schemas.Event)."
                }
              }
            }
          },
          "400": {
            "description": "invalid_request: the body is not a DecisionRequest with a path.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              }
            }
          },
          "401": {
            "description": "unauthorized: the server needs credentials (an API key, or its token) and the request's bearer token is missing or wrong.",
            "headers": {
              "WWW-Authenticate": {
                "description": "Bearer realm=\"agentkit\"",
                "schema": {
                  "type": "string"
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              }
            }
          },
          "403": {
            "description": "forbidden: the request's credential does not have the scope agent:run. Or csrf_failed: a session's request without the server's Origin or the CSRF token of GET /v1/auth/me in X-Agentkit-CSRF.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              }
            }
          },
          "404": {
            "description": "not_found: no such run.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              }
            }
          },
          "409": {
            "description": "not_pending: the run does not wait at that path; run_final: the run has ended; awaiting_decision, shape_changed: the flow changed since the run suspended; run_leased: it is going on.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              }
            }
          },
          "413": {
            "description": "too_large: the body is over the server's limit.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              }
            }
          },
          "503": {
            "description": "over_capacity: too many runs (retryable); shutting_down: the server is draining.",
            "headers": {
              "Retry-After": {
                "description": "Seconds to wait.",
                "schema": {
                  "type": "string"
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              }
            }
          }
        }
      }
    },
    "/v1/runs/{id}/input": {
      "post": {
        "operationId": "answerRun",
        "summary": "Answer what a run waits for",
        "description": "Answers interrupts of a suspended chat run: a question a tool asks (text, one of its choices if it has any), or an approval the run's tool policy wants (approved, and a reason for a denial). Answers may come one request at a time; the same answer again is accepted (a retry is safe). Until every interrupt of the run's pending turn has its answer, the response is the run, still suspended, with the answers so far. With the last one, the run goes on in the background: an answer is its question's result, an approved call runs with exactly the input it was approved with, a denied call's result is the denial. The response is then the run as it is, or with Accept: text/event-stream its events from there on. Who answered is the request's authenticated user, never the body.",
        "parameters": [
          {
            "name": "id",
            "in": "path",
            "description": "The run's ID.",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/InputRequest"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "The run.",
            "content": {
