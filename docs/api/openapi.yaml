    "/v1/credentials/{slot}/connect": {
      "post": {
        "operationId": "connectCredential",
        "summary": "Start connecting an account with OAuth2",
        "description": "Starts the authorization code flow with PKCE (S256) for the slot's OAuth2 app and returns the provider's page to send the user's browser to. The provider sends the browser back to the server's GET /oauth/callback (no bearer token: the flow's state, random, single use and valid for 10 minutes, names it), which exchanges the code with the verifier and stores the tokens for the caller (scope user) or the caller's tenant (scope tenant, with credentials:admin). It then shows a page of its own, or redirects to return_url with result (connected, denied, expired or failed) and slot added to its query.",
        "parameters": [
          {
            "name": "slot",
            "in": "path",
            "description": "The credential slot, as a toolset's spec names it.",
            "required": true,
            "schema": {
              "type": "string"
            }
