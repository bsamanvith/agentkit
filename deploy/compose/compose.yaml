# The split deployment (docs/COMPONENTS.md) in Docker Compose, the twin of
# deploy/k8s/local: the agent API with the console, a runner and the toolsets,
# Postgres for the store, and the console on http://localhost:30081 (the
# cluster's is on 30080, so both can run at once). scripts/compose-local.sh
# runs it (make compose-up); see deploy/compose/README.md.
#
# The images are the ones make images-split builds, never pulled. The secrets
# come from deploy/compose/.env, which compose-local.sh writes on the first up
# and keeps (git ignores it): AGK_RPC_TOKEN, AGK_API_TOKEN, AGK_PG_PASSWORD,
# AGK_ANTHROPIC_API_KEY. Each component gets only the ones it needs, as the
# cluster's secret gives them.
#
# Profile allinone: one container of the agentkit-local image, every
# component in one process on SQLite, console on http://localhost:30082
# (scripts/compose-local.sh up allinone).
name: agentkit

# The config every component mounts: the same file as the cluster's ConfigMap
# (deploy/k8s/base/kustomization.yaml) and scripts/smoke.sh's.
configs:
  agentkit:
    file: ../k8s/base/config.json

# What every agentkit container shares: the cluster's security context, its
# probes (the image's own self-check, as distroless has no shell or curl) and
# grace period, and the overlay's limits.
x-agentkit: &agentkit
  pull_policy: never
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  stop_grace_period: 20s
  configs:
    - {source: agentkit, target: /etc/agentkit/config.json}
  healthcheck:
    test: ["CMD", "/app", "healthcheck", "-ready"]
    interval: 5s
    timeout: 3s
    start_period: 10s
    retries: 3
  deploy:
    resources:
      reservations: {cpus: "0.02", memory: 32M}
      limits: {cpus: "0.5", memory: 128M}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    command: ["-c", "shared_buffers=32MB", "-c", "max_connections=40"]
    environment:
      POSTGRES_USER: agentkit
      POSTGRES_DB: agentkit
      POSTGRES_PASSWORD: ${AGK_PG_PASSWORD:?run scripts/compose-local.sh up, which writes deploy/compose/.env}
    volumes: [postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "agentkit", "-d", "agentkit"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        reservations: {cpus: "0.05", memory: 64M}
        limits: {cpus: "1", memory: 256M}

  # The cluster's init container: agentkit migrate (idempotent, under an
  # advisory lock) with the api image, once, before the API starts.
  migrate:
    <<: *agentkit
    image: agentkit-api:latest
    restart: "no"
    command: [migrate]
    healthcheck: {disable: true}
    environment:
      AGENTKIT_STORE: postgres://agentkit:${AGK_PG_PASSWORD}@postgres:5432/agentkit?sslmode=disable
    depends_on:
      postgres: {condition: service_healthy}
    deploy:
      resources:
        reservations: {cpus: "0.01", memory: 16M}
        limits: {cpus: "0.2", memory: 64M}

  toolsets:
    <<: *agentkit
    image: agentkit-toolsets:latest
    environment:
      AGENTKIT_COMPONENTS: toolsets,mcp-server
      AGENTKIT_RPC_TOKEN: ${AGK_RPC_TOKEN:?run scripts/compose-local.sh up}
      # MCP clients send the API token to /mcp/<name>.
      AGENTKIT_API_TOKEN: ${AGK_API_TOKEN:?run scripts/compose-local.sh up}
      # Connector keys go here, and only here (TAVILY_API_KEY, ...).
    # Files a toolset reads go under /etc/agentkit next to the config, one
    # bind mount each, relative to this file: the handbook knowledge base
    # of config.json (deploy/local/agent/knowledge).
    volumes: [../local/agent/knowledge:/etc/agentkit/knowledge:ro]

  runner:
    <<: *agentkit
    image: agentkit-runner:latest
    environment:
      AGENTKIT_COMPONENTS: runner
      AGENTKIT_TOOLSETS_URL: http://toolsets:8080
      AGENTKIT_RPC_TOKEN: ${AGK_RPC_TOKEN}
      ANTHROPIC_API_KEY: ${AGK_ANTHROPIC_API_KEY:-}
    depends_on:
      toolsets: {condition: service_started}

  api:
    <<: *agentkit
    image: agentkit-api:latest
    environment:
      AGENTKIT_COMPONENTS: agent,web
      AGENTKIT_RUNNER_URL: http://runner:8080
      AGENTKIT_TOOLSETS_URL: http://toolsets:8080
      AGENTKIT_RPC_TOKEN: ${AGK_RPC_TOKEN}
      AGENTKIT_API_TOKEN: ${AGK_API_TOKEN}
      AGENTKIT_STORE: postgres://agentkit:${AGK_PG_PASSWORD}@postgres:5432/agentkit?sslmode=disable
      AGENTKIT_STORE_MIGRATE: "off"
    # Loopback only: the console and /v1 for this machine.
    ports: ["127.0.0.1:30081:8080"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      runner: {condition: service_started}
      toolsets: {condition: service_started}

  # Profile allinone: the agentkit-local image (make image-local), the agent
  # API, console, turn loops and toolsets in one process, on SQLite in the
  # volume allinone. Started by name: scripts/compose-local.sh up allinone.
  allinone:
    <<: *agentkit
    profiles: [allinone]
    image: agentkit-local:latest
    environment:
      AGENTKIT_COMPONENTS: agent,web,mcp-server
      AGENTKIT_API_TOKEN: ${AGK_API_TOKEN:?run scripts/compose-local.sh up allinone}
      AGENTKIT_STORE: sqlite:/var/lib/agentkit/agentkit.db
      ANTHROPIC_API_KEY: ${AGK_ANTHROPIC_API_KEY:-}
    volumes: [allinone:/var/lib/agentkit]
    tmpfs: [/tmp]
    ports: ["127.0.0.1:30082:8080"]
    depends_on:
      allinone-volume: {condition: service_completed_successfully}
    deploy:
      resources:
        reservations: {cpus: "0.02", memory: 32M}
        limits: {cpus: "1", memory: 256M}

  # A new named volume is owned by root; the images run as uid 65532. This
  # hands it over once per up, and exits.
  allinone-volume:
    profiles: [allinone]
    image: busybox:1.37
    restart: "no"
    command: ["chown", "65532:65532", "/var/lib/agentkit"]
    volumes: [allinone:/var/lib/agentkit]
    network_mode: none

volumes:
  postgres:
  allinone:
