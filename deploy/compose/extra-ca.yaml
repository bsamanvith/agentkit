# Added by scripts/compose-local.sh when EXTRA_CA_FILE names a PEM file of
# CAs (behind a TLS-intercepting proxy, such as a Claude Code cloud
# session's): the agentkit containers trust them too. Go reads every file of
# SSL_CERT_DIR's folders: the image's CAs, then these.
x-extra-ca: &extra-ca
  environment:
    SSL_CERT_DIR: /etc/ssl/certs:/etc/ssl/extra
  volumes:
    - ${EXTRA_CA_FILE:?}:/etc/ssl/extra/ca.crt:ro

services:
  toolsets: *extra-ca
  runner: *extra-ca
  api: *extra-ca
  allinone: *extra-ca
