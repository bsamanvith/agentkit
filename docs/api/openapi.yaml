          "id": {
            "type": "string"
          },
          "agent": {
            "type": "string",
            "description": "The agent it belongs to."
          },
          "status": {
            "enum": [
              "idle",
              "running",
              "interrupted"
            ],
            "description": "idle: post a message to go on; running: a run is going on; interrupted: post with no message to resume."
          },
          "created_at": {
            "type": "string",
            "format": "date-time"
          },
          "updated_at": {
            "type": "string",
            "format": "date-time"
          },
          "messages": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/TimedMessage"
