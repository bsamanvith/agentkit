      "UIAction": {
        "type": "object",
        "description": "In place of a message: what the person did on an A2UI surface the agent showed (a ui event), sent to that conversation (conversation_id) of an agent with ui a2ui. The next user message is the action as structured text: <ui_action> and the A2UI action message as JSON (version, then action with name, surfaceId, sourceComponentId, the server's timestamp and context). With a message too, without a conversation, to an agent without UI, or with a field the check refuses, it is 400 invalid_request.",
        "properties": {
          "surface_id": {
            "type": "string",
