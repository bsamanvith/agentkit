          },
          "prompt": {
            "$ref": "#/components/schemas/TimedMessage"
          },
          "turn": {
            "type": "integer",
            "description": "text_delta, tool_call, tool_result, turn_done: the turn, from 1."
          },
          "block": {
            "type": "integer",
            "description": "text_delta."
          },
          "text": {
            "type": "string",
            "description": "text_delta."
          },
          "call": {
            "type": "integer",
            "description": "tool_call, tool_result: the call's index in its turn."
          },
          "tool_use_id": {
            "type": "string"
          },
          "name": {
            "type": "string",
            "description": "tool_call."
          },
          "input": {
            "description": "tool_call: the tool's input."
          },
          "content": {
            "type": "string",
            "description": "tool_result."
          },
          "is_error": {
            "type": "boolean",
            "description": "tool_result."
          },
          "duration_ms": {
            "type": "number",
            "description": "tool_result."
          },
          "record": {
            "$ref": "#/components/schemas/TurnRecord"
          },
          "answer": {
            "type": "string",
            "description": "run_done."
          },
          "final": {
            "$ref": "#/components/schemas/Message"
          },
          "usage": {
            "$ref": "#/components/schemas/Usage"
          },
          "turns": {
            "type": "integer",
            "description": "run_done, run_error: model calls."
          },
          "error": {
            "$ref": "#/components/schemas/Error"
          }
        },
        "required": [
          "v",
          "type",
          "seq",
          "run_id",
          "at"
        ]
